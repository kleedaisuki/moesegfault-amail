<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
    <title>登录未完成 · amail</title>
    <style>
      /* 中文：采用 MoeSegfault Style v0.1.2 的公开语义颜色；不反射错误或 URL 参数。 English: Use public MoeSegfault Style v0.1.2 semantic colors; never reflect errors or URL parameters. */
      :root{--moe-background:#fff6ea;--moe-surface-strong:#fffdf8;--moe-heading:#26110b;--moe-text:#4b2a1e;--moe-text-soft:#805648;--moe-accent:#e66a3f;--moe-border:#f3bf98bd;--moe-accent-wash:#ffe1cccc;color-scheme:light}
      @media(prefers-color-scheme:dark){:root{--moe-background:#21130f;--moe-surface-strong:#30201b;--moe-heading:#fff6ef;--moe-text:#f6e7dc;--moe-text-soft:#d9b8a6;--moe-accent:#f27a50;--moe-border:#a06345b3;--moe-accent-wash:#853e2a6b;color-scheme:dark}}
      *{box-sizing:border-box}html{min-height:100%}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 15% 10%,var(--moe-accent-wash),transparent 38%),var(--moe-background);color:var(--moe-text);font-family:"Atkinson Hyperlegible","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.6}
      main{width:min(100%,540px)}.brand{display:flex;align-items:center;gap:12px;margin:0 0 24px;font-size:15px;font-weight:750;letter-spacing:.02em}.brand svg{width:37px;height:37px;flex:none}.brand small{display:block;color:var(--moe-text-soft);font-size:11px;font-weight:600;letter-spacing:.06em}
      .card{border:1px solid var(--moe-border);border-radius:22px;padding:clamp(26px,6vw,44px);background:var(--moe-surface-strong);box-shadow:0 18px 44px #9e4e2529}.symbol{display:grid;place-items:center;width:54px;height:54px;border-radius:15px;background:var(--moe-accent-wash);color:var(--moe-accent);font-size:29px;font-weight:800}
      .eyebrow{margin:24px 0 8px;color:var(--moe-accent);font-size:11px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;color:var(--moe-heading);font-family:Georgia,"Noto Serif SC",serif;font-size:clamp(31px,6vw,44px);line-height:1.2;letter-spacing:-.04em}p{margin:17px 0 0;color:var(--moe-text-soft);font-size:15px}.en{margin-top:10px;font-size:13px;line-height:1.7}.status{display:inline-flex;align-items:center;gap:9px;margin-top:28px;padding:8px 12px;border-radius:999px;background:var(--moe-accent-wash);color:var(--moe-text);font-size:12px;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:var(--moe-accent)}code{font-family:"IBM Plex Mono","Cascadia Mono",monospace;font-size:.9em}
      footer{margin:20px 0 0;color:var(--moe-text-soft);font-size:11px;line-height:1.7}@media(max-width:480px){body{padding:18px}.brand{margin-bottom:17px}.card{border-radius:18px}}
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="coral" x1="10" y1="8" x2="54" y2="57" gradientUnits="userSpaceOnUse"><stop stop-color="#ff8569"/><stop offset="1" stop-color="#bd4525"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#coral)"/><path fill="#fffaf2" d="M18 13h9v14.4L40.2 13H51L35.7 30.2 52 51H40.6L28.3 35.3 27 36.7V51h-9V13Z"/><path fill="#ffb55e" d="m49.5 7 1.8 4.7L56 13.5l-4.7 1.8L49.5 20l-1.8-4.7-4.7-1.8 4.7-1.8L49.5 7Z"/></svg>
        <span>amail <small>by MoeSegfault</small></span>
      </div>
      <article class="card" role="alert" aria-labelledby="result-title">
        <div class="symbol" aria-hidden="true">!</div>
        <div class="eyebrow">Authentication incomplete</div>
        <h1 id="result-title">登录未完成</h1>
        <p>没有保存新的登录会话。请返回终端查看错误，然后重新运行 <code>amail auth login</code>。</p>
        <p class="en" lang="en">No new session was saved. Check the error in your terminal, then run <code>amail auth login</code> again.</p>
        <div class="status"><span class="dot" aria-hidden="true"></span>需要重试 <span lang="en">· Retry in terminal</span></div>
      </article>
      <footer>为保护隐私，此页面不显示错误详情或令牌。<span lang="en"> Error details and credentials are not shown here.</span></footer>
    </main>
  </body>
</html>
