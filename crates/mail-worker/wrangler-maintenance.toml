# Paused scheduled-only Mail: merge is not provider deployment or activation authority.
# Same Rust/Wasm artifact as the API; no migrations, routes, HTTP, RPC or send binding.
name = "amail-mail-maintenance"
main = "entry/maintenance.mjs"
compatibility_date = "2026-09-25"
workers_dev = false
preview_urls = false
routes = []
logpush = false

[vars]
CF_ZONE_ID = "6edff81c6ed02f412e70868076411a5e"
EMAIL_INGRESS_WORKER_NAME = "amail-inbound"
OPENROUTER_EMBEDDING_MODEL = "qwen/qwen3-embedding-8b"

[[d1_databases]]
binding = "MAIL_DB"
database_name = "moesegfault-mail-production"
database_id = "ad06f7f3-8897-4150-b9a9-7a46a8e55b30"

[[r2_buckets]]
binding = "MAIL_BODIES"
bucket_name = "moesegfault-mail-raw-production"

[[queues.producers]]
binding = "TRACE_EVENTS"
queue = "amail-trace-events"

[version_metadata]
binding = "VERSION_METADATA"

[triggers]
# Activation requires reviewed source cadence and separate realm authorization.
crons = []

[observability]
enabled = false
head_sampling_rate = 1.0
redact_query_string = true

[observability.logs]
enabled = false
invocation_logs = false

[observability.traces]
enabled = false

[observability.issues]
enabled = false

[env.staging]
name = "amail-mail-maintenance-staging"
compatibility_date = "2026-09-25"
workers_dev = false
preview_urls = false
routes = []
logpush = false

[env.staging.vars]
CF_ZONE_ID = "6edff81c6ed02f412e70868076411a5e"
EMAIL_INGRESS_WORKER_NAME = "amail-inbound-staging"
OPENROUTER_EMBEDDING_MODEL = "qwen/qwen3-embedding-8b"

[[env.staging.d1_databases]]
binding = "MAIL_DB"
database_name = "moesegfault-mail-staging"
database_id = "74f35f95-42ce-482c-86e6-dffbdd35cbbe"

[[env.staging.r2_buckets]]
binding = "MAIL_BODIES"
bucket_name = "moesegfault-mail-raw-staging"

[[env.staging.queues.producers]]
binding = "TRACE_EVENTS"
queue = "amail-trace-events-staging"

[env.staging.version_metadata]
binding = "VERSION_METADATA"

[env.staging.triggers]
# Activation requires reviewed source cadence and separate realm authorization.
crons = []

[env.staging.observability]
enabled = false
head_sampling_rate = 1.0
redact_query_string = true

[env.staging.observability.logs]
enabled = false
invocation_logs = false

[env.staging.observability.traces]
enabled = false

[env.staging.observability.issues]
enabled = false
