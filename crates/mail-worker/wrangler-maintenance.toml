# Scheduled-only Mail: source adoption is not provider deployment or activation authority.
# Same Rust/Wasm artifact as the API; no migrations, routes, HTTP, RPC or send binding.
name = "amail-mail-maintenance"
main = "entry/maintenance.mjs"
compatibility_date = "2026-09-25"
workers_dev = false
preview_urls = false
routes = []
logpush = false

[vars]
MAIL_DOMAIN = "mail.moesegfault.dev"
CF_ZONE_ID = "6edff81c6ed02f412e70868076411a5e"
EMAIL_INGRESS_WORKER_NAME = "amail-inbound"
OPENROUTER_EMBEDDING_MODEL = "qwen/qwen3-embedding-8b"

[[d1_databases]]
binding = "MAIL_DB"
database_name = "moesegfault-mail-production-708b6d6c734779d657f5abb3"
database_id = "d9be9bb4-5a73-4223-85d6-b04763e6f03b"

[[r2_buckets]]
binding = "MAIL_BODIES"
bucket_name = "moesegfault-mail-raw-production-708b6d6c734779d657f5abb3"

[[queues.producers]]
binding = "TRACE_EVENTS"
queue = "amail-trace-events"

[version_metadata]
binding = "VERSION_METADATA"

[triggers]
# The protected fresh-online executor separately authorizes this owned scope's activation.
crons = ["*/5 * * * *"]

[observability]
enabled = false
head_sampling_rate = 1.0
redact_query_string = true

[observability.logs]
enabled = false
invocation_logs = false

[observability.traces]
enabled = false

[observability.issues]
enabled = false

[env.staging]
name = "amail-mail-maintenance-staging"
compatibility_date = "2026-09-25"
workers_dev = false
preview_urls = false
routes = []
logpush = false

[env.staging.vars]
# Scheduled usage reconciliation loads the same issuer-scoped Billing contract as the API.
IDENTITY_ISSUER = "https://identity-staging.moesegfault.dev"
BILLING_BASE_URL = "https://billing-staging.moesegfault.dev"
BILLING_SUBSCRIBE_ORIGIN = "https://subscribe-staging.moesegfault.dev"
BILLING_RETURN_URL = "https://amail-staging.moesegfault.dev/billing/return"
MAIL_DOMAIN = "mail-staging.moesegfault.dev"
CF_ZONE_ID = "6edff81c6ed02f412e70868076411a5e"
EMAIL_INGRESS_WORKER_NAME = "amail-inbound-staging"
OPENROUTER_EMBEDDING_MODEL = "qwen/qwen3-embedding-8b"

[[env.staging.d1_databases]]
binding = "MAIL_DB"
database_name = "moesegfault-mail-staging"
database_id = "74f35f95-42ce-482c-86e6-dffbdd35cbbe"

[[env.staging.r2_buckets]]
binding = "MAIL_BODIES"
bucket_name = "moesegfault-mail-raw-staging"

[[env.staging.queues.producers]]
binding = "TRACE_EVENTS"
queue = "amail-trace-events-staging"

[env.staging.version_metadata]
binding = "VERSION_METADATA"

[env.staging.triggers]
# The v0.1.2 staging writer first deploys this private Worker paused, then activates
# only after the pinned legacy Cron cohort is bounded and existing leases fenced.
crons = ["*/5 * * * *"]

[env.staging.observability]
enabled = false
head_sampling_rate = 1.0
redact_query_string = true

[env.staging.observability.logs]
enabled = false
invocation_logs = false

[env.staging.observability.traces]
enabled = false

[env.staging.observability.issues]
enabled = false
