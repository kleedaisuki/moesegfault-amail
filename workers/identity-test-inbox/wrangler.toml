# 中文：此 Worker 仅用于预发布 Identity 邮件验证；无 HTTP 域名或 workers.dev 地址。
# English: Staging Identity verification only; no HTTP route or workers.dev address.
name = "amail-identity-test-inbox-staging"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-28"
workers_dev = false
preview_urls = false

[[r2_buckets]]
binding = "PRIVATE_INBOX"
bucket_name = "amail-identity-test-inbox-staging"

# Explicit, staging-only Identity contact allowlist. Each address still needs
# its own short-lived, exact Email Routing rule before a verification attempt.
[vars]
TEST_RECIPIENTS = "amail-e2e@moesegfault.dev,amail-e2e-isolation@moesegfault.dev"

# 中文：验证邮件含短期秘密，禁止自动请求、邮件与 R2 追踪。
# English: Verification mail carries a short-lived secret; disable automatic traces.
[observability]
enabled = false
