# Native Email Sending Queue consumer. / 原生邮件发送事件队列消费者。
name = "amail-events"
main = "entry/queue.mjs"
compatibility_date = "2026-09-25"
workers_dev = false
preview_urls = false

[vars]
CF_ACCOUNT_ID = "07109e406d4e1ab7a0997dd399db6fd5"
CF_ZONE_ID = "6edff81c6ed02f412e70868076411a5e"
MAIL_DOMAIN = "mail.moesegfault.dev"

[[d1_databases]]
binding = "MAIL_DB"
database_name = "moesegfault-mail-production-708b6d6c734779d657f5abb3"
database_id = "d9be9bb4-5a73-4223-85d6-b04763e6f03b"

[[queues.consumers]]
queue = "amail-sending-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 120
dead_letter_queue = "amail-sending-events-dlq"

# Queue payload contains recipient, sender, subject and SMTP response.
# 队列负载包含收发件人、标题和 SMTP 响应，禁用自动观测以免泄漏。
[observability]
enabled = false
# Keep the full production metadata contract even while every capture switch is off.
head_sampling_rate = 1.0
redact_query_string = true

[observability.logs]
enabled = false
invocation_logs = false

[observability.traces]
enabled = false

[observability.issues]
enabled = false

[env.staging]
name = "amail-events-staging"
workers_dev = false
preview_urls = false

[env.staging.vars]
CF_ACCOUNT_ID = "07109e406d4e1ab7a0997dd399db6fd5"
CF_ZONE_ID = "6edff81c6ed02f412e70868076411a5e"
MAIL_DOMAIN = "mail-staging.moesegfault.dev"

[[env.staging.d1_databases]]
binding = "MAIL_DB"
database_name = "moesegfault-mail-staging"
database_id = "74f35f95-42ce-482c-86e6-dffbdd35cbbe"

[[env.staging.queues.consumers]]
queue = "amail-sending-events-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 120
dead_letter_queue = "amail-sending-events-dlq-staging"

[env.staging.observability]
enabled = false

[env.staging.observability.logs]
enabled = false
invocation_logs = false

[env.staging.observability.traces]
enabled = false

[env.staging.observability.issues]
enabled = false
