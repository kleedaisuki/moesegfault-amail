[package]
name = "amail-events"
version = "0.1.2"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8.7", features = ["d1", "queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
