[package]
name = "amail-role-monitor"
version = "0.2.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8.7", features = ["d1", "queue"] }
amail-trace-schema = { path = "../../crates/trace-schema" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
