# Infrastructure-only pair: private traced probe and untraced synthetic caller.
# No Mail bindings, user identities, runtime secrets, SMTP or public probe route.
name = "amail-native-trace-probe"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

[vars]
CANARY_ROLE = "probe"

[observability]
enabled = true
head_sampling_rate = 1.0
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false
persist = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
head_sampling_rate = 1.0

[env.caller]
name = "amail-native-trace-caller"
workers_dev = true
preview_urls = false

[env.caller.vars]
CANARY_ROLE = "caller"
# Non-secret synthetic coordinate; deployment overrides this for each experiment.
PROBE_ID = "0123456789abcdef0123456789abcdef"

[[env.caller.services]]
binding = "PROBE"
service = "amail-native-trace-probe"

# Incoming caller data is not forwarded and must not be captured by observability.
[env.caller.observability]
enabled = false

[env.caller.observability.logs]
enabled = false
invocation_logs = false
persist = false

[env.caller.observability.traces]
enabled = false
