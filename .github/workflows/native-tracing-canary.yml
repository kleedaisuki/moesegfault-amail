# Synthetic infrastructure experiment only; no Mail/data/sending capability.
name: Native Cloudflare tracing experiment
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful full compiled-main CI run (required for experiment, unused by absent-endpoint diagnosis)
        required: false
        type: string
      confirm:
        description: RUN_NATIVE_TRACING_ROUTE_CANARY (reserved owned DNS/Route), historical RUN_NATIVE_TRACING_CANARY, or read-only endpoint diagnosis
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: amail-native-tracing-experiment
  cancel-in-progress: false
jobs:
  experiment:
    if: github.ref == 'refs/heads/main' && (inputs.confirm == 'RUN_NATIVE_TRACING_CANARY' || inputs.confirm == 'RUN_NATIVE_TRACING_ROUTE_CANARY') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANARY_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current infrastructure orchestration before provider capabilities
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install --only-binary=:all: -r infra/dns/requirements.txt -r infra/tests/ten_address_requirements.txt
          python -m unittest discover -s infra/tests -v
      - name: Admit fully checked original-main artifact before provider access
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: python infra/ci/validated_worker_build.py prepare --source-run-id "$SOURCE_RUN"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          artifact-ids: ${{ steps.build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Verify original source/compiler/run and every byte (no Rust rebuild)
        run: python infra/ci/validated_worker_build.py restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned packager only
        run: npm install --global wrangler@4.142.0
      - name: Deploy and read back the isolated pair from tested module bytes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$CANARY_CONFIRM" = "RUN_NATIVE_TRACING_ROUTE_CANARY" ]; then
            python infra/deploy/native_tracing_experiment.py deploy-route
          else
            python infra/deploy/native_tracing_experiment.py deploy
          fi
      - name: Invoke four synthetic native cases once
        if: inputs.confirm == 'RUN_NATIVE_TRACING_CANARY'
        run: python infra/deploy/native_tracing_experiment.py trigger
      - name: Revalidate owned ingress then invoke four synthetic native cases once
        if: inputs.confirm == 'RUN_NATIVE_TRACING_ROUTE_CANARY'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python infra/deploy/native_tracing_experiment.py trigger-route
      - name: Collect complete retained native records and parentage
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_OBSERVABILITY_TOKEN: ${{ secrets.CF_OBSERVABILITY_TOKEN }}
        run: |
          if [ "$CANARY_CONFIRM" = "RUN_NATIVE_TRACING_ROUTE_CANARY" ]; then
            python infra/deploy/native_tracing_experiment.py collect-route
          else
            python infra/deploy/native_tracing_experiment.py collect
          fi
      - name: Remove only receipt-owned ingress and scripts and verify absence
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$CANARY_CONFIRM" = "RUN_NATIVE_TRACING_ROUTE_CANARY" ]; then
            python infra/deploy/native_tracing_experiment.py cleanup-route
          else
            python infra/deploy/native_tracing_experiment.py cleanup
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-tracing-experiment-${{ github.run_id }}
          path: .temp/native-tracing/experiment.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  diagnose:
    if: github.ref == 'refs/heads/main' && (inputs.confirm == 'DIAGNOSE_NATIVE_TRACING_ENDPOINT' || inputs.confirm == 'DIAGNOSE_NATIVE_TRACING_CLIENT_SIGNATURE') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CANARY_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source orchestration without provider capabilities
        run: |
          python -m pip install --only-binary=:all: -r infra/dns/requirements.txt -r infra/tests/ten_address_requirements.txt
          python -m unittest discover -s infra/tests -v
      - name: Diagnose only an absent infrastructure caller hostname (no deploy or invocation)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$CANARY_CONFIRM" = "DIAGNOSE_NATIVE_TRACING_CLIENT_SIGNATURE" ]; then
            python infra/deploy/native_tracing_experiment.py diagnose-client-signature
          else
            python infra/deploy/native_tracing_experiment.py diagnose
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-endpoint-diagnostic-${{ github.run_id }}
          path: .temp/native-tracing/experiment.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
