# Validate other workflows even when GitHub rejects ci.yml before creating jobs.
name: Workflow syntax guard

on:
  push:
    branches: [main, codex/amail-v0.1.0]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Workflow YAML and dispatch limits
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the pinned non-executing YAML parser
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r infra/workflow_lint/requirements.txt
      - name: Verify synthetic parser and boundary fixtures
        run: python -m unittest discover -s infra/workflow_lint -p 'test_*.py' -v
      - name: Check all workflow files independently of CI
        run: python infra/workflow_lint/check.py
