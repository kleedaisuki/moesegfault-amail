# Site-only hosted evidence; never deploys or receives provider credentials.
name: Candidate site CI

on:
  push:
    branches: [main, codex/amail-site-candidate]
    paths: ['site/**', 'infra/release/candidate_site.py', 'infra/release/check_candidate_site_gate.py', '.github/workflows/site-ci.yml', '.github/workflows/site-candidate.yml', 'docs/site-*.md']
  pull_request:
    paths: ['site/**', 'infra/release/candidate_site.py', 'infra/release/check_candidate_site_gate.py', '.github/workflows/site-ci.yml', '.github/workflows/site-candidate.yml', 'docs/site-*.md']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    name: Select affected candidate site checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      site: ${{ steps.delta.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select this update without rechecking an unchanged candidate
        id: delta
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          # The reviewed native-only patch verifies its versioned public output
          # once in the tagged release, not in repeated candidate site builds.
          if [[ "$WORKFLOW_REF" == */.github/workflows/site-ci.yml@* ]] &&
             { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; } && python - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'infra/release')
          import native_patch
          try:
              matched = native_patch.applies(os.environ['GITHUB_SHA'])
          except ValueError:
              matched = False
          raise SystemExit(0 if matched else 1)
          PY
          then
            echo 'site=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Reusable calls use their caller's github context and must produce
          # fresh acceptance, including when that caller is a PR workflow.
          if [[ "$WORKFLOW_REF" != */.github/workflows/site-ci.yml@* ]] ||
             { [ "$EVENT" != push ] && { [ "$EVENT" != pull_request ] || [ "$ACTION" != synchronize ]; }; } ||
             ! [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'site=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if grep -Eq '^site/|^infra/release/(candidate_site|check_candidate_site_gate)\.py$|^docs/site-[^/]*\.md$' <<< "$changed"; then
            echo 'site=true' >> "$GITHUB_OUTPUT"
          else
            echo 'site=false' >> "$GITHUB_OUTPUT"
          fi

  site:
    # The read-only deployment gate requires this exact successful job name.
    name: Astro candidate site source checks
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check both site workflow syntaxes with digest-pinned actionlint
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .temp/actionlint
          curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 60 \
            --location --output .temp/actionlint/archive.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz
          echo '900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a  .temp/actionlint/archive.tar.gz' | sha256sum --check -
          tar -xzf .temp/actionlint/archive.tar.gz -C .temp/actionlint actionlint
          .temp/actionlint/actionlint .github/workflows/site-ci.yml .github/workflows/site-candidate.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked site dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro and route-local release-state fixtures
        run: |
          pnpm check
          node --test scripts/check-release-state.test.mjs
      - name: Build truthful candidate and prepare production noindex
        env:
          AMAIL_RELEASE_STATE: candidate
        run: |
          pnpm build
          pnpm check:release-state candidate
          python ../infra/release/candidate_site.py prepare "$GITHUB_SHA"
      - name: Verify fresh published output does not inherit candidate headers
        env:
          AMAIL_RELEASE_STATE: published
        run: |
          pnpm build
          pnpm check:release-state published
          cmp public/_headers dist/_headers
