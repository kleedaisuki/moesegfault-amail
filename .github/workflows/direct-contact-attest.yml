# Receipt verification and human coverage are distinct evidence; health never attests either.
name: Attest or revoke direct-forward contact verification

on:
  workflow_dispatch:
    inputs:
      target:
        description: Realm whose exact contact contract was reviewed
        required: true
        type: choice
        options: [staging, production]
      verified:
        description: Revoke unconditionally or attest one reviewed contact evidence basis
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      contact_contract_id:
        description: For verification only, exact adopted contract UUID; blank for revoke
        required: false
        type: string
      contact_coverage:
        description: Legacy commitment, type ACCEPT_INBOX_JUNK_AND_24H_CLOUDFLARE_RESPONSE; leave blank with contact_evidence
        required: false
        type: string
      contact_evidence:
        description: Verified destination and four received roles; type VERIFIED_DESTINATION_AND_ROLE_RECEIPTS, leave coverage blank
        required: false
        type: string
      case_ref:
        description: Opaque contact evidence/intervention reference, no private text
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: amail-direct-contact-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  attest:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record reviewed contact basis or unconditional revocation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_GATE: abuse_contact_verified
          INPUT_VERIFIED: ${{ inputs.verified }}
          INPUT_CONTACT_CONTRACT_ID: ${{ inputs.contact_contract_id }}
          INPUT_CONTACT_COVERAGE: ${{ inputs.contact_coverage }}
          INPUT_CONTACT_EVIDENCE: ${{ inputs.contact_evidence }}
          INPUT_CASE_REF: ${{ inputs.case_ref }}
        run: python infra/operator/attest_gate.py
