# 中文：运营角色邮件只通过显式主分支人工操作开通，不部署额外 Worker。
# English: Route reserved operational mail only through a manual main-branch action.
name: Reserved role forwarding

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Request private destination verification, audit, or apply four exact rules
        required: true
        type: choice
        options: [request-verification, audit, apply]
      confirm:
        description: For apply only, enter APPLY_ROLE_FORWARDING
        required: false
        type: string
      case_ref:
        description: For provider mutations, opaque hold/invalidation reference; blank for audit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: amail-direct-contact-production
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Verify explicit mutation confirmation
        env:
          PHASE: ${{ inputs.phase }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$PHASE" == "apply" && "$CONFIRM" != "APPLY_ROLE_FORWARDING" ]]; then
            echo 'Explicit apply confirmation required' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Any failure or ambiguous result stops before the provider mutation.
      - name: Invalidate contact acceptance and prove production global hold
        if: inputs.phase != 'audit'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INPUT_TARGET: production
          INPUT_CASE_REF: ${{ inputs.case_ref }}
        run: python infra/operator/direct_contact_invalidate.py
      - name: Reconcile private destination and exact role rules
        env:
          ROLE_FORWARD_PHASE: ${{ inputs.phase }}
          ROLE_FORWARD_DESTINATION: ${{ secrets.ROLE_FORWARD_DESTINATION }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python infra/provider/ensure_role_forwarding.py
