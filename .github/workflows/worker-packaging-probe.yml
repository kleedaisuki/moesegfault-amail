# Credential-free diagnostic only: final packaged bytes are not release admission.
name: Worker packaging boundary probe
on:
  pull_request:
    paths:
      - '.github/workflows/worker-packaging-probe.yml'
      - 'infra/tests/worker_packaging_probe.py'
      - 'infra/tests/worker-packaging-probe.mjs'
      - 'infra/tests/test_worker_packaging_probe.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: worker-packaging-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    name: Inspect actual Wrangler package bytes (diagnostic, no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test synthetic source and packaging boundaries
        run: python -m unittest discover -s infra/tests -p 'test_worker_packaging_probe.py' -v
      - name: Select fully checked exact PR-base bytes
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python infra/tests/worker_packaging_probe.py prepare --base-sha "$BASE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.build_run_id }}
          artifact-ids: ${{ steps.build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Verify original source/compiler/run and all generated bytes
        run: python infra/tests/worker_packaging_probe.py restore
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/tests/worker-boundary/pnpm-lock.yaml
      - name: Install locked native runtime and pinned packager (no compiler)
        run: |
          pnpm --dir infra/tests/worker-boundary install --frozen-lockfile
          npm install --global wrangler@4.142.0
      - name: Package ordinary products without credentials or deployment
        run: python infra/tests/worker_packaging_probe.py package
      - name: Exercise only the actual packaged module graphs
        shell: bash
        run: |
          node --test infra/tests/worker-packaging-probe.mjs | tee .temp/ci/packaging-probe/native.tap
          python -c 'import sys; sys.path.insert(0,"infra/ci"); from native_suite import counts; from pathlib import Path; counts(Path(".temp/ci/packaging-probe/native.tap").read_text(),16)'
      - name: Preserve public module bytes and original/probe identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-packaging-probe-${{ github.run_id }}
          path: .temp/ci/packaging-probe/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
