# English: Manual main runs verify candidates or recover one existing tagged bundle without rebuilding.
name: Release amail CLI

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      recover_run_id:
        description: Optional failed tagged release run whose successful bundle should be published
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      recover: ${{ steps.version.outputs.recover }}
      publish: ${{ steps.version.outputs.publish }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      reuse_candidate: ${{ steps.candidate.outputs.reuse_candidate }}
      build_matrix: ${{ steps.candidate.outputs.build_matrix }}
      focused_native: ${{ steps.patch.outputs.focused_native }}
      runtime_tag: ${{ steps.patch.outputs.runtime_tag }}
      focused_test_filter: ${{ steps.patch.outputs.focused_test_filter }}
      acceptance_kind: ${{ steps.patch.outputs.acceptance_kind }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require trusted source and matching site/CLI version
        id: version
        shell: bash
        env:
          RECOVER_RUN_ID: ${{ inputs.recover_run_id }}
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\([^"]*\)"/\1/p;}' crates/amail/Cargo.toml | head -n 1)
          test -n "$version"
          site_version=$(python -c 'import json; print(json.load(open("site/package.json"))["version"])')
          test "$site_version" = "$version"
          # A missing note must fail before the expensive five-platform build.
          test -s "docs/releases/v$version.md"
          recover=false
          publish=false
          source_sha="$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/v*)
              git fetch origin main
              git merge-base --is-ancestor "$GITHUB_SHA" origin/main
              test "v$version" = "$GITHUB_REF_NAME"
              publish=true
              ;;
            workflow_dispatch:refs/heads/main)
              if [ -n "$RECOVER_RUN_ID" ]; then
                [[ "$RECOVER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                git fetch origin "refs/tags/v$version:refs/tags/v$version"
                source_sha=$(git rev-parse "v$version^{commit}")
                git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
                recover=true
                publish=true
              fi
              ;;
            *) echo '::error::Untrusted release source'; exit 1 ;;
          esac
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          printf 'recover=%s\npublish=%s\nsource_sha=%s\n' "$recover" "$publish" "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Admit the reviewed native-only patch and compatible deployed runtime
        id: patch
        run: python infra/release/native_patch.py
      - name: Select accepted native reuse and only previously unbuilt platforms
        id: candidate
        if: steps.version.outputs.recover != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python infra/release/promote_candidate.py admit '${{ steps.version.outputs.tag }}'

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    if: needs.preflight.outputs.recover != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Use checked-in exact Rust compiler
        run: rustup show active-toolchain
      - name: Reuse only platform/compiler-matched dependency work
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cli-dependencies-v1
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: true
      - name: Test CLI on release platform
        if: needs.preflight.outputs.reuse_candidate != 'true' && needs.preflight.outputs.focused_native != 'true'
        run: cargo test -p amail --locked --all-targets
      - name: Test only the reviewed native patch contract
        if: needs.preflight.outputs.focused_native == 'true'
        shell: bash
        env:
          AMAIL_NATIVE_TEST_FILTER: ${{ needs.preflight.outputs.focused_test_filter }}
        run: |
          test -n "$AMAIL_NATIVE_TEST_FILTER"
          cargo test -p amail --locked --release --bin amail "$AMAIL_NATIVE_TEST_FILTER"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise the native daemon/profile journey on the release platform
        if: needs.preflight.outputs.reuse_candidate != 'true' && needs.preflight.outputs.focused_native != 'true'
        shell: bash
        run: python scripts/v030_profile_journey.py --binary "target/debug/amail${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Build release binary
        run: cargo build -p amail --locked --release
      - name: Check the newly built platform binary version
        shell: bash
        run: test "$(target/release/amail${{ runner.os == 'Windows' && '.exe' || '' }} --version)" = "amail ${RELEASE_TAG#v}"
      - name: Archive Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release-payload
          cp target/release/amail README.md LICENSE release-payload/
          tar -C release-payload -czf "amail-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" amail README.md LICENSE
      - name: Archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-payload | Out-Null
          Copy-Item target/release/amail.exe,README.md,LICENSE release-payload/
          Compress-Archive -Path release-payload/* -DestinationPath "amail-$($env:RELEASE_TAG)-${{ matrix.target }}.zip" -Force
      - name: Attest release archive
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: amail-${{ needs.preflight.outputs.tag }}-${{ matrix.target }}.*
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: amail-${{ matrix.target }}
          path: amail-${{ needs.preflight.outputs.tag }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

  permanent-acquire:
    name: Verify permanent mailbox acquire on staging
    needs: [preflight, build]
    if: >-
      always() && !cancelled() && needs.preflight.result == 'success' &&
      needs.preflight.outputs.focused_native == 'true' &&
      needs.preflight.outputs.acceptance_kind == 'permanent-acquire' &&
      needs.preflight.outputs.publish == 'true' &&
      needs.preflight.outputs.recover != 'true' && needs.build.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Download only this run's newly built Windows executable archive
        uses: actions/download-artifact@v4
        with:
          name: amail-x86_64-pc-windows-msvc
          path: .temp/staging-cli
      - name: Select the same-run candidate and bind its executable hash
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE '.temp/staging-cli/amail-v0.3.2-x86_64-pc-windows-msvc.zip'
          Expand-Archive -LiteralPath $archive -DestinationPath .temp/staging-cli
          $binary = Join-Path $env:GITHUB_WORKSPACE '.temp/staging-cli/amail.exe'
          "AMAIL_STAGING_TEST_BINARY=$binary" >> $env:GITHUB_ENV
          "AMAIL_STAGING_TEST_BINARY_SHA256=$((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV
      - name: Install only the existing native browser credential adapters
        run: python -m pip install pywin32==312 websocket-client==1.9.2
      - name: Exercise native acquire repeat upgrade release and reacquire only
        env:
          STAGING_E2E_USERNAME: ${{ secrets.STAGING_E2E_USERNAME }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          AMAIL_STAGING_PERMANENT_ACQUIRE_CONFIRM: RUN_STAGING_PERMANENT_ACQUIRE
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_permanent_acquire_e2e.py
      - name: Retain acceptance only after the native journey and cleanup succeed
        uses: actions/upload-artifact@v4
        with:
          name: permanent-acquire-acceptance-${{ github.run_id }}
          path: .temp/permanent-acquire-acceptance.json
          if-no-files-found: error
          retention-days: 30

  approval-browser:
    name: Verify native approval in a real browser
    needs: [preflight, build]
    if: >-
      always() && !cancelled() && needs.preflight.result == 'success' &&
      needs.preflight.outputs.focused_native == 'true' &&
      needs.preflight.outputs.acceptance_kind == 'approval' &&
      needs.preflight.outputs.publish == 'true' &&
      needs.preflight.outputs.recover != 'true' && needs.build.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the same-run Windows release archive
        uses: actions/download-artifact@v4
        with:
          name: amail-x86_64-pc-windows-msvc
          path: .temp/approval-cli
      - name: Restore the newly built executable without rebuilding
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE ".temp/approval-cli/amail-$($env:RELEASE_TAG)-x86_64-pc-windows-msvc.zip"
          Expand-Archive -LiteralPath $archive -DestinationPath .temp/approval-cli
      - name: Install an isolated pinned Chromium harness
        shell: bash
        run: |
          npm install --prefix .temp/approval-browser-tools --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.51.1
          node .temp/approval-browser-tools/node_modules/playwright/cli.js install chromium
      - name: Click actual approval forms with isolated state and no cloud credentials
        shell: bash
        run: >-
          node scripts/approval_journey.mjs
          --binary .temp/approval-cli/amail.exe
          --browser-module .temp/approval-browser-tools/node_modules/playwright/index.mjs
          --output .temp/approval-browser-evidence
      - name: Retain successful browser acceptance and review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: approval-browser-acceptance-${{ github.run_id }}
          path: .temp/approval-browser-evidence/
          if-no-files-found: error
          retention-days: 30

  reuse-candidate:
    name: Package the three already-tested native executables
    needs: preflight
    if: needs.preflight.outputs.recover != 'true' && needs.preflight.outputs.reuse_candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit original native producers and successful semantic acceptance
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python infra/release/promote_candidate.py admit '${{ needs.preflight.outputs.tag }}'
      - name: Download the original complete candidate bundle
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.cli_artifact_id }}
          run-id: ${{ steps.candidate.outputs.source_run }}
          github-token: ${{ github.token }}
          path: .temp/release-candidate
          merge-multiple: true
      - name: Download the matching deployed semantic acceptance receipt
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.acceptance_artifact_id }}
          run-id: ${{ steps.candidate.outputs.acceptance_run }}
          github-token: ${{ github.token }}
          path: .temp/ci/staging-acceptance
          merge-multiple: true
      - name: Verify original bytes and package public docs with native provenance
        run: python infra/release/promote_candidate.py package '${{ needs.preflight.outputs.tag }}'
      - name: Attest packaging of the unchanged tested executable bytes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: .temp/reused-release/amail-${{ needs.preflight.outputs.tag }}-*
      - name: Upload repackaged native archives
        uses: actions/upload-artifact@v4
        with:
          name: amail-tested-native-repack
          path: .temp/reused-release/amail-${{ needs.preflight.outputs.tag }}-*
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble and verify release bundle
    needs: [preflight, build, reuse-candidate]
    if: >-
      always() && !cancelled() && needs.preflight.outputs.recover != 'true' &&
      needs.build.result == 'success' &&
      (needs.preflight.outputs.reuse_candidate != 'true' || needs.reuse-candidate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: amail-*
          path: dist
          merge-multiple: true
      - name: Package agent skill
        shell: bash
        run: |
          test -f skills/amail/SKILL.md
          cd skills
          zip -q -r "../dist/amail-agent-skill-${RELEASE_TAG}.zip" amail
      - name: Attest agent skill bundle
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: dist/amail-agent-skill-${{ needs.preflight.outputs.tag }}.zip
      - name: Generate and verify release checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 6
          sha256sum --check SHA256SUMS
      - name: Upload verified bundle for dry-run inspection or publishing
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ needs.preflight.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  recover-bundle:
    name: Recover verified existing tagged bundle
    if: needs.preflight.outputs.recover == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_exists: ${{ steps.recovery.outputs.release_exists }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Admit same-tag successful original bundle and read Release state
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER_RUN_ID: ${{ inputs.recover_run_id }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: python infra/release/recover_bundle.py
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.recovery.outputs.artifact_id }}
          run-id: ${{ inputs.recover_run_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - name: Verify original bundle names and bytes against its manifest
        run: python infra/release/verify_published_assets.py dist '${{ needs.preflight.outputs.tag }}' --trusted-manifest dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ needs.preflight.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  send-release-gate:
    name: Require production outbound release attestations
    if: needs.preflight.outputs.publish == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      AMAIL_RELEASE_VERSION: ${{ needs.preflight.outputs.runtime_tag }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check production health and read-only D1 send release state
        run: python infra/release/check_send_gate.py

  publish:
    name: Publish GitHub Release
    if: >-
      always() && !cancelled() && needs.preflight.outputs.publish == 'true' &&
      needs.preflight.result == 'success' && needs.send-release-gate.result == 'success' &&
      (needs.assemble.result == 'success' || needs.recover-bundle.result == 'success') &&
      (needs.preflight.outputs.focused_native != 'true' ||
       (needs.preflight.outputs.acceptance_kind == 'permanent-acquire' && needs.permanent-acquire.result == 'success') ||
       (needs.preflight.outputs.acceptance_kind == 'approval' && needs.approval-browser.result == 'success') ||
       needs.recover-bundle.result == 'success')
    needs: [preflight, assemble, recover-bundle, send-release-gate, permanent-acquire, approval-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ needs.preflight.outputs.tag }}
          path: dist
      - name: Create immutable GitHub Release
        if: needs.recover-bundle.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${{ needs.preflight.outputs.tag }}" dist/* --verify-tag --notes-file "docs/releases/${{ needs.preflight.outputs.tag }}.md" --title "${{ needs.preflight.outputs.tag }}"

  verify-published:
    name: Verify published Release asset bytes
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.publish.result == 'success' && needs.preflight.outputs.publish == 'true' }}
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ needs.preflight.outputs.tag }}
          path: .temp/release-assembled
      - name: Download every published asset into repository temp
        shell: bash
        run: |
          mkdir -p .temp/release-published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir .temp/release-published
      - name: Require exact published names and checksum-matching bytes
        shell: bash
        run: python infra/release/verify_published_assets.py .temp/release-published "$RELEASE_TAG" --trusted-manifest .temp/release-assembled/SHA256SUMS

  launch-site:
    name: Launch public site after release assets
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.verify-published.result == 'success' && needs.preflight.outputs.publish == 'true' }}
    needs: [preflight, verify-published]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-site-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify Cloudflare deploy credentials
        working-directory: .
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Require deployed mail API before public launch
        working-directory: .
        shell: bash
        run: curl --user-agent amail-release-check --fail --silent --show-error --retry 6 --retry-delay 5 https://mail.moesegfault.dev/health > /dev/null
      - name: Install locked site dependencies
        run: pnpm install --frozen-lockfile
      - name: Build launch site
        env:
          AMAIL_RELEASE_STATE: published
        run: pnpm build
      - name: Verify published site copy before launch
        run: |
          pnpm check
          node --test scripts/check-release-state.test.mjs
          pnpm check:release-state published
      - name: Pin published responses to the tested source without provider injection
        working-directory: .
        run: python infra/release/published_site.py prepare "${{ needs.preflight.outputs.source_sha }}" "${{ needs.preflight.outputs.tag }}"
      - name: Deploy public launch site
        run: pnpm run deploy
      - name: Smoke test public launch pages
        working-directory: .
        shell: bash
        env:
          RELEASE_REVISION: ${{ needs.preflight.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .temp
          smoke_dir=$(mktemp -d .temp/site-smoke.XXXXXX)
          trap 'rm -f -- "$smoke_dir"/*.html "$smoke_dir"/*.headers; rmdir -- "$smoke_dir"' EXIT
          # Only public GETs are retried: never repeat a deployment on stale cache.
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            complete=true
            for route in home manual changelog; do
              path=/
              if [ "$route" != home ]; then path="/$route/"; fi
              remaining=$((deadline - SECONDS))
              [ "$remaining" -gt 0 ] || { complete=false; break; }
              timeout=15
              [ "$remaining" -ge "$timeout" ] || timeout="$remaining"
              if ! curl --fail --silent --show-error --max-time "$timeout" \
                --user-agent 'Mozilla/5.0 amail-release-check' \
                --dump-header "$smoke_dir/$route.headers" --output "$smoke_dir/$route.html" \
                "https://amail.moesegfault.dev$path"; then
                complete=false
                break
              fi
            done
            if [ "$complete" = true ] && python infra/release/published_site.py smoke "$smoke_dir" "$RELEASE_REVISION" "$RELEASE_TAG"; then
              exit 0
            fi
            remaining=$((deadline - SECONDS))
            [ "$remaining" -gt 0 ] || break
            pause=5
            [ "$remaining" -ge "$pause" ] || pause="$remaining"
            sleep "$pause"
          done
          echo '::error::Published site did not reach the exact source revision within 120 seconds'
          exit 1
