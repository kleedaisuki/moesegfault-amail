name: Actual owned production users

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Register dedicated verified principals or use normal mail commands
        type: choice
        options: [register, journey]
        required: true
      confirm:
        description: RUN_OWNED_PRODUCTION_USERS
        type: string
        required: true
      grant_confirm:
        description: Optional GRANT_OWNED_PRODUCTION_TWO_USER_SENDS for exact dedicated actors under the global hold
        type: string
        default: ''
        required: false
      prior_run:
        description: Optional exact prior actual-user run; reuse accepted sends and owned mail without resending
        type: string
        default: ''
        required: false

permissions:
  contents: read
  actions: read

jobs:
  users:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_OWNED_PRODUCTION_USERS' && github.run_attempt == 1
    runs-on: windows-latest
    environment: production
    timeout-minutes: 40
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing native browser runtime
        run: |
          python -m pip install --only-binary=:all: pywin32==312 websocket-client==1.9.2
      - name: Use official Chrome for Testing with an isolated profile
        run: |
          $catalog = Invoke-RestMethod -Uri 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json' -TimeoutSec 30
          $version = [string]$catalog.channels.Stable.version
          if ($version -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') { throw 'chrome_release_version_invalid' }
          New-Item -ItemType Directory -Path .temp/browser-runtime -Force | Out-Null
          $url = "https://storage.googleapis.com/chrome-for-testing-public/$version/win64/chrome-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile .temp/browser-runtime/chrome.zip -TimeoutSec 180
          Expand-Archive -LiteralPath .temp/browser-runtime/chrome.zip -DestinationPath .temp/browser-runtime
          $binary = (Resolve-Path .temp/browser-runtime/chrome-win64/chrome.exe).Path
          "AMAIL_TEST_CHROME=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "official_chrome_for_testing_version=$version"
      - name: Download existing CI-built release candidate without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36909041053 -n amail-x86_64-pc-windows-msvc -D .temp/release-candidate
          if ($LASTEXITCODE -ne 0) { throw 'candidate_download_failed' }
          Expand-Archive -LiteralPath .temp/release-candidate/amail-v0.1.0-x86_64-pc-windows-msvc.zip -DestinationPath .temp/production-cli
      - name: Recover only the named previous opaque journey receipt
        if: inputs.prior_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN: ${{ inputs.prior_run }}
          JOURNEY_PHASE: ${{ inputs.phase }}
        run: |
          if ($env:JOURNEY_PHASE -cne 'journey' -or $env:PRIOR_RUN -cnotmatch '^[1-9][0-9]{0,19}$') { throw 'prior_journey_invalid' }
          gh run download $env:PRIOR_RUN -n "actual-owned-user-receipt-$env:PRIOR_RUN" -D .temp/prior-journey
          if ($LASTEXITCODE -ne 0) { throw 'prior_journey_receipt_unavailable' }
      - name: Perform authorized owned production user actions
        env:
          USER_JOURNEY_CONFIRM: ${{ inputs.confirm }}
          USER_JOURNEY_PHASE: ${{ inputs.phase }}
          USER_JOURNEY_GRANT_CONFIRM: ${{ inputs.grant_confirm }}
          USER_JOURNEY_PRIOR_RUN: ${{ inputs.prior_run }}
          PRODUCTION_ACTOR_A_USERNAME: ${{ secrets.PRODUCTION_ACTOR_A_USERNAME }}
          PRODUCTION_ACTOR_A_PASSWORD: ${{ secrets.PRODUCTION_ACTOR_A_PASSWORD }}
          PRODUCTION_ACTOR_B_USERNAME: ${{ secrets.PRODUCTION_ACTOR_B_USERNAME }}
          PRODUCTION_ACTOR_B_PASSWORD: ${{ secrets.PRODUCTION_ACTOR_B_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/actual_production_user.py
      # Exact actual send receipts contain opaque IDs and observations only.
      # Never upload auth homes, browser profiles, drafts, raw mail or ZIPs.
      - name: Preserve opaque actual-user operation receipts
        if: always() && inputs.phase == 'journey'
        uses: actions/upload-artifact@v4
        with:
          name: actual-owned-user-receipt-${{ github.run_id }}
          path: .temp/actual-production-users/receipt.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
