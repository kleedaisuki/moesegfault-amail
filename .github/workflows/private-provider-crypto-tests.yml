# Synthetic keys only; this workflow never receives provider secrets or reads mail.
name: Private provider capture synthetic crypto
on:
  push:
    branches: [codex/amail-v0.1.0, main]
    paths:
      - 'infra/tests/private_provider_*'
      - 'infra/tests/test_private_provider_*.py'
      - '.github/workflows/private-provider-crypto-tests.yml'
  pull_request:
    paths:
      - 'infra/tests/private_provider_*'
      - 'infra/tests/test_private_provider_*.py'
      - '.github/workflows/private-provider-crypto-tests.yml'
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Synthetic crypto and confidentiality contracts
        env:
          PRIVATE_CAPTURE_SYNTHETIC_HOSTED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s infra/tests -p 'test_private_provider_*.py' -v
