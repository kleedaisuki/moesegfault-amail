# English: Manual, staging-only Worker-created private R2 capability and recovery.
name: Staging Worker-created R2 capability

on:
  workflow_dispatch:
    inputs:
      target:
        description: Exact one-shot probe or prior-run recovery
        required: true
        type: choice
        options: [staging-worker-r2-get-delete, staging-worker-r2-recover]
      confirm:
        description: Exact RUN_* or RECOVER_* confirmation
        required: true
        type: string
      worker_r2_send_attest:
        description: One synthetic apex send grant attestation; probe only
        required: false
        type: string
      worker_r2_prior_run_id:
        description: Original numeric probe run ID; recovery only
        required: false
        type: string
      worker_r2_prior_run_attempt:
        description: Original probe attempt (must be 1); recovery only
        required: false
        type: string
      worker_r2_prior_sha:
        description: Independently reviewed original probe source SHA; recovery only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-worker-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging-worker-r2-probe:
    name: One-shot Worker-created R2 GET/DELETE
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-worker-r2-get-delete' &&
      github.ref == 'refs/heads/codex/amail-v0.1.0'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Require one-shot Worker-created object confirmation
        env:
          WORKER_R2_CONFIRM: ${{ inputs.confirm }}
          WORKER_R2_SEND_ATTEST: ${{ inputs.worker_r2_send_attest }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
        shell: pwsh
        run: |
          if ($env:WORKER_R2_CONFIRM -ne 'RUN_STAGING_WORKER_R2_GET_DELETE' -or
              $env:WORKER_R2_SEND_ATTEST -ne 'ATTEST_ONE_SYNTHETIC_APEX_SEND' -or
              $env:CURRENT_ATTEMPT -ne '1') {
            throw 'Explicit first-attempt Worker-created R2 probe confirmation required'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test Worker-created object probe contracts without secrets
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s infra/tests -p 'test_staging_worker_created_r2.py' -v
      - name: Probe Worker-created private R2 object
        env:
          AMAIL_WORKER_R2_MODE: probe
          AMAIL_WORKER_R2_CONFIRM: ${{ inputs.confirm }}
          AMAIL_SENDING_GRANT_ATTEST: ${{ inputs.worker_r2_send_attest }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_worker_created_r2.py

  staging-worker-r2-recover:
    name: Recover Worker-created R2 exact object
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-worker-r2-recover' &&
      github.ref == 'refs/heads/codex/amail-v0.1.0'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      actions: read
    timeout-minutes: 20
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Require exact prior Worker-created probe identity
        env:
          WORKER_R2_CONFIRM: ${{ inputs.confirm }}
          PRIOR_RUN_ID: ${{ inputs.worker_r2_prior_run_id }}
          PRIOR_ATTEMPT: ${{ inputs.worker_r2_prior_run_attempt }}
          PRIOR_SHA: ${{ inputs.worker_r2_prior_sha }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
        shell: pwsh
        run: |
          if ($env:WORKER_R2_CONFIRM -ne 'RECOVER_STAGING_WORKER_R2_GET_DELETE' -or
              $env:CURRENT_ATTEMPT -ne '1' -or
              $env:PRIOR_RUN_ID -notmatch '^[1-9][0-9]{0,19}$' -or
              $env:PRIOR_ATTEMPT -ne '1' -or
              $env:PRIOR_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Explicit original first-attempt Worker-created R2 recovery coordinates required'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test Worker-created object recovery contracts without secrets
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s infra/tests -p 'test_staging_worker_created_r2.py' -v
      - name: Recover one Worker-created private R2 object
        env:
          AMAIL_WORKER_R2_MODE: recover
          AMAIL_WORKER_R2_CONFIRM: ${{ inputs.confirm }}
          AMAIL_WORKER_R2_PRIOR_RUN_ID: ${{ inputs.worker_r2_prior_run_id }}
          AMAIL_WORKER_R2_PRIOR_RUN_ATTEMPT: ${{ inputs.worker_r2_prior_run_attempt }}
          AMAIL_WORKER_R2_PRIOR_SHA: ${{ inputs.worker_r2_prior_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_worker_created_r2.py
