# English: Explicit staging-only read-only incident inspection / synthetic native D1 proof.
name: Staging quota D1 synthetic provider proof

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only failed apply inspection, additive schemas, or synthetic mirror proof
        type: choice
        options: [inspect, apply-schema, write-synthetic, read-terminal]
        required: true
      confirm:
        description: Exact documented INSPECT/APPLY/WRITE/READ_TERMINAL confirmation
        type: string
        required: true
      source_run:
        description: Successful six-job source CI for this exact checkout
        type: string
        required: true
      prior_run:
        description: 36787173756 for inspect; original synthetic write run for read-terminal
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  proof:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/amail-v0.1.0' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AMAIL_D1_PROOF_ENVIRONMENT: staging
      AMAIL_D1_PROOF_MODE: ${{ inputs.mode }}
      AMAIL_D1_PROOF_CONFIRM: ${{ inputs.confirm }}
      AMAIL_D1_PROOF_SOURCE_RUN: ${{ inputs.source_run }}
      AMAIL_D1_PROOF_PRIOR_RUN: ${{ inputs.prior_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact dispatch and confirmation before Secrets
        run: |
          python -c 'import sys; sys.path.insert(0,"infra/tests"); import os, staging_ten_address_d1_proof as p; p.guard(os.environ["AMAIL_D1_PROOF_MODE"])'
      - name: Install pinned synthetic encryption dependency
        run: |
          python -m pip install --only-binary=:all: -r infra/tests/ten_address_requirements.txt
      - name: Test native D1 proof contracts without Secrets or provider access
        run: |
          python -m unittest discover -s infra/tests -p 'test_staging_ten_address*.py' -v
          python infra/tests/staging_ten_address_crypto_check.py -v
      - name: Run explicitly confirmed native D1 proof only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python infra/tests/staging_ten_address_d1_proof.py "$AMAIL_D1_PROOF_MODE"
