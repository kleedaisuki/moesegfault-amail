# Diagnostic replay cannot replace the normal source CI or promotion gates.
name: Native fixture replay (diagnostic)
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Completed source CI run with a successful Worker build producer
        required: true
        type: string
      fixture:
        description: One package-owned native *.test.mjs file
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: native-fixture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture:
    name: Replay one native fixture without Rust rebuild (not release evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Select original successful build producer
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          FIXTURE: ${{ inputs.fixture }}
        run: python infra/ci/native_fixture.py prepare --build-run-id "$BUILD_RUN_ID" --fixture "$FIXTURE"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          artifact-ids: ${{ steps.build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Verify compiled inputs and every generated byte
        env:
          GH_TOKEN: ${{ github.token }}
        run: python infra/ci/native_fixture.py restore
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/tests/worker-boundary/pnpm-lock.yaml
      - name: Install locked native runtime
        run: pnpm --dir infra/tests/worker-boundary install --frozen-lockfile
      - name: Execute the complete selected fixture
        env:
          FIXTURE: ${{ inputs.fixture }}
        run: python infra/ci/native_fixture.py execute --fixture "$FIXTURE"
