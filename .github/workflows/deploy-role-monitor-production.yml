# This operation introduces the role producer only after accepted API/sink and
# staged role privacy evidence. It never changes the four live role rules.
name: Deploy production role monitor
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Enter RUN_PRODUCTION_UNROUTED_ROLE_ROLLOUT
        required: true
        type: string
      freeze:
        description: Enter FREEZE_PRODUCTION_GRAPH_WRITERS after freezing external writers
        required: true
        type: string
      lifecycle:
        description: Confirm pristine first bootstrap or pinned unrouted predecessor replacement
        required: true
        type: choice
        options: [first-bootstrap, replacement]
      phase1_run:
        description: Successful production api-only deployment run at this exact source
        required: true
        type: string
      privacy_run:
        description: Distinct successful production whole-record API/sink privacy run
        required: true
        type: string
      staged_role_run:
        description: Exact-source complete staged Email/Cron/fault/rollback privacy acceptance
        required: true
        type: string
      api_version:
        description: Exact single-100 production API version
        required: true
        type: string
      sink_version:
        description: Exact single-100 production sink version
        required: true
        type: string
      role_version:
        description: Exact non-Queue predecessor version; empty only for first bootstrap
        required: false
        type: string
      queue_id:
        description: Independently reviewed production trace Queue identity
        required: true
        type: string
      dlq_id:
        description: Independently reviewed production trace dead-letter Queue identity
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: amail-production-graph-writer
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy pinned unrouted production role producer
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'RUN_PRODUCTION_UNROUTED_ROLE_ROLLOUT' && inputs.freeze == 'FREEZE_PRODUCTION_GRAPH_WRITERS'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      ROLE_FORWARD_DESTINATION: ${{ secrets.ROLE_FORWARD_DESTINATION }}
      CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      AMAIL_ROLE_ROLLOUT_CONFIRM: ${{ inputs.confirm }}
      AMAIL_ROLE_LIFECYCLE: ${{ inputs.lifecycle }}
      AMAIL_PRODUCTION_PHASE1_RUN: ${{ inputs.phase1_run }}
      AMAIL_PRODUCTION_PRIVACY_RUN: ${{ inputs.privacy_run }}
      AMAIL_STAGED_ROLE_ACCEPTANCE_RUN: ${{ inputs.staged_role_run }}
      AMAIL_EXPECTED_WORKER_VERSION: ${{ inputs.api_version }}
      AMAIL_EXPECTED_TRACE_SINK_VERSION: ${{ inputs.sink_version }}
      AMAIL_EXPECTED_ROLE_WORKER_VERSION: ${{ inputs.role_version }}
      AMAIL_TRACE_QUEUE_ID: ${{ inputs.queue_id }}
      AMAIL_TRACE_DLQ_ID: ${{ inputs.dlq_id }}
      AMAIL_TRACE_TOPOLOGY: api-only
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require immutable production privacy and staged role acceptance before provider mutation
        run: python infra/deploy/require_production_role_phase1.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned tools
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install worker-build --version 0.8.5 --locked
          npm install --global wrangler@4.142.0
      - name: Hosted source contracts
        run: |
          cargo test -p amail-role-monitor --locked --all-targets
          python -m unittest discover -s infra/tests -p 'test_production_role_*.py' -v
      - name: Audit exact phase1 graph, untouched forwards, held sending and isolated storage
        run: python infra/deploy/check_production_role_graph.py --phase before --lifecycle "$AMAIL_ROLE_LIFECYCLE"
      - name: Apply reviewed additive migration once with redacted output
        run: python infra/deploy/migrate_production_role.py
      - name: Bundle private role Worker
        working-directory: workers/role-monitor
        run: worker-build --release
      - name: Repeat phase1 graph and migrated empty state immediately before deployment
        shell: bash
        run: |
          args=()
          if [ "$AMAIL_ROLE_LIFECYCLE" = first-bootstrap ]; then args+=(--migrated); fi
          python infra/deploy/check_production_role_graph.py --phase before --lifecycle "$AMAIL_ROLE_LIFECYCLE" "${args[@]}"
      - name: Deploy one unrouted role Worker with restricted temporary secrets
        id: role
        run: python infra/deploy/deploy_production_role_monitor.py
      - name: Verify exact phase2 graph without changing role routes or release policy
        env:
          AMAIL_TRACE_TOPOLOGY: api-role
          AMAIL_EXPECTED_ROLE_WORKER_VERSION: ${{ steps.role.outputs.version }}
        run: python infra/deploy/check_production_role_graph.py --phase after --lifecycle "$AMAIL_ROLE_LIFECYCLE"
