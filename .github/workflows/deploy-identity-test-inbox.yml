# 中文：仅在人工触发后部署预发布验证码收件 Worker；绝不自动开启邮件路由。
# English: Manually deploy the staging verification inbox; never open its mail route here.
name: Deploy staging Identity test inbox

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful full CI run for this exact current main SHA; omitted selects an exact-main run, never an ancestor
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-native-mail-acceptance
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy checked private Rust Email Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check deployment credentials
        shell: bash
        run: |
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CF_EMAIL_ROUTING_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing $key"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require full checked artifact for this exact main source
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python infra/ci/inbox_worker_artifact.py prepare --source-run-id "$SOURCE_RUN_ID"
      - name: Download only the admitted original producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Verify original source run compiler and complete generated file hashes
        run: python infra/ci/inbox_worker_artifact.py restore
      - name: Install reviewed deployment tools
        run: |
          npm install --global wrangler@4.142.0
      - name: Refuse deployment while any test alias is routed
        shell: bash
        run: |
          state=$(python workers/identity-test-inbox/ensure_route.py --all-absent)
          if [ "$state" != absent ]; then
            echo '::error::Close every exact test routing rule before replacing the inbox Worker'
            exit 1
          fi
      - name: Check private staging binding and live R2 public surfaces
        run: python workers/identity-test-inbox/check_config.py --live
      - name: Deploy staging-only private Email Worker
        working-directory: workers/identity-test-inbox
        run: wrangler deploy
      - name: Confirm deploy did not open any test alias
        shell: bash
        run: |
          state=$(python workers/identity-test-inbox/ensure_route.py --all-absent)
          if [ "$state" != absent ]; then
            echo '::error::Inbox deployment unexpectedly changed Email Routing'
            exit 1
          fi
      - name: Read back deployed recipient allowlist and private bucket
        run: python workers/identity-test-inbox/check_config.py --live --deployed
