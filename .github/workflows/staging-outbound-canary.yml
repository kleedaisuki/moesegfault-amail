# One synthetic external send only; the protected staging Environment owns every capability.
# This reusable workflow has no dispatch trigger. A separately reviewed CI hook is required.
name: Staging outbound canary

on:
  workflow_call:
    inputs:
      confirm:
        description: Enter RUN_STAGING_OUTBOUND_CANARY after reviewing the one-use grant
        required: true
        type: string

permissions:
  contents: read

jobs:
  outbound-canary:
    name: One-use hosted Windows external-inbox and feedback oracle
    if: >-
      inputs.confirm == 'RUN_STAGING_OUTBOUND_CANARY' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: windows-latest
    environment: staging
    timeout-minutes: 35
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install native-login adapters
        run: python -m pip install pywin32==312 websocket-client==1.9.2
      - name: Build and test matching native amail
        run: |
          rustup update stable
          cargo test -p amail --locked --all-targets
          cargo build -p amail --locked
      - name: Native PKCE and one guarded outbound canary
        env:
          AMAIL_OUTBOUND_CONFIRM: ${{ inputs.confirm }}
          STAGING_E2E_USERNAME: ${{ secrets.STAGING_E2E_USERNAME }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          STAGING_E2E_OWNER_SUB: ${{ secrets.STAGING_E2E_OWNER_SUB }}
          AMAIL_CANARY_SENDER: ${{ secrets.AMAIL_CANARY_SENDER }}
          AMAIL_CANARY_RECIPIENT: ${{ secrets.AMAIL_CANARY_RECIPIENT }}
          AMAIL_CANARY_IMAP_HOST: ${{ secrets.AMAIL_CANARY_IMAP_HOST }}
          AMAIL_CANARY_IMAP_USER: ${{ secrets.AMAIL_CANARY_IMAP_USER }}
          AMAIL_CANARY_IMAP_PASSWORD: ${{ secrets.AMAIL_CANARY_IMAP_PASSWORD }}
          AMAIL_CANARY_AUTHSERV_ID: ${{ secrets.AMAIL_CANARY_AUTHSERV_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_hosted_outbound_canary.py
