# Manual zero-business-data discriminator; never deploys or attests original Mail.
name: Staging code-free Issues create discriminator
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: CREATE_STAGING_CODE_FREE_ISSUES_PROBE_ONCE
        required: true
        type: string
      writer_freeze:
        description: FREEZE_STAGING_MAIL_SETTINGS_ROUTING_AND_PROBE_WRITERS (external freeze is required)
        required: true
        type: string
      reviewed_sha:
        description: Independently reviewed immutable main SHA, equal to repository approval variable
        required: true
        type: string
permissions:
  contents: read
jobs:
  guard:
    name: Credential-free dispatch and synthetic contracts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ISSUES_CONFIRM: ${{ inputs.confirm }}
      ISSUES_FREEZE: ${{ inputs.writer_freeze }}
      ISSUES_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      ISSUES_APPROVED_SHA: ${{ vars.STAGING_ISSUES_CREATE_REVIEWED_SHA }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Verify exact reviewed first-attempt dispatch before environment secrets
        run: python infra/provider/staging_issues_create_probe.py --guard
      - name: Test one-shot and workflow contracts without provider access
        run: python -m unittest discover -s infra/tests -p 'test_staging_issues_create_probe.py' -v

  probe:
    name: One fixed code-free creation and independent current GET
    needs: guard
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    env:
      ISSUES_CONFIRM: ${{ inputs.confirm }}
      ISSUES_FREEZE: ${{ inputs.writer_freeze }}
      ISSUES_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      ISSUES_APPROVED_SHA: ${{ vars.STAGING_ISSUES_CREATE_REVIEWED_SHA }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Repeat provenance guard after protected environment approval
        run: python infra/provider/staging_issues_create_probe.py --guard
      - name: Create once and classify bounded independent readback
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python infra/provider/staging_issues_create_probe.py
      - name: Preserve non-secret exact-identity recovery pins after readback failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-issues-create-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/issues-create-probe/resource.json
          include-hidden-files: true
          overwrite: false
          if-no-files-found: ignore
          retention-days: 7
# No DELETE, rerun, fallback name, routing write, code upload, or mail fixture.
