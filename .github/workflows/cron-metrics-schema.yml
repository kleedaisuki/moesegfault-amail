# Schema-only metadata does not bypass Mail capture/Issues or release gates.
name: Cron metrics schema discriminator

on:
  pull_request:
    paths:
      - '.github/workflows/cron-metrics-schema.yml'
      - 'infra/provider/probe_cron_metrics_schema.py'
      - 'infra/tests/test_cron_metrics_schema.py'
  workflow_dispatch:
    inputs:
      confirm:
        description: READ_CRON_METRICS_SCHEMA after independent review and synthetic CI
        type: string
        required: true

permissions:
  contents: read

jobs:
  contracts:
    name: Non-deploying schema discriminator contracts
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test synthetic schema and privacy contracts without credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s infra/tests -p 'test_cron_metrics_schema.py' -v

  schema:
    name: Read fixed GraphQL type metadata only
    needs: contracts
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'READ_CRON_METRICS_SCHEMA'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 2
    concurrency:
      group: staging-cron-metrics-schema-read
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query reviewed schema aliases without account or workload records
        env:
          AMAIL_SCHEMA_CONFIRM: ${{ inputs.confirm }}
          CF_OBSERVABILITY_TOKEN: ${{ secrets.CF_OBSERVABILITY_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/provider/probe_cron_metrics_schema.py
