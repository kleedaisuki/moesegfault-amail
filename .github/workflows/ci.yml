    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Verify deploy credentials
        shell: bash
        run: |
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CF_EMAIL_ROUTING_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing $key"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Download exact tested same-run Worker modules
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.worker-build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Verify source run compiler and every generated byte before provider changes
        working-directory: .
        run: python infra/ci/worker_artifact.py restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Wrangler
        run: |
          npm install --global wrangler@4.142.0
      - name: Refuse deployment while any public test alias is routed
        shell: bash
        run: |
          state=$(python workers/identity-test-inbox/ensure_route.py --all-absent)
          if [ "$state" != absent ]; then
            echo '::error::Close every exact test route before replacing the inbox Worker'
            exit 1
          fi
      - name: Check private staging binding and no HTTP surface
        run: python workers/identity-test-inbox/check_config.py --live
      - name: Deploy staging Identity test inbox without routing rule
        working-directory: workers/identity-test-inbox
        run: wrangler deploy
      - name: Verify deployment did not open any test alias
        shell: bash
        run: |
          state=$(python workers/identity-test-inbox/ensure_route.py --all-absent)
          if [ "$state" != absent ]; then
            echo '::error::Inbox deployment unexpectedly changed Email Routing'
            exit 1
          fi
      - name: Read back deployed recipient allowlist and private bucket
        run: python workers/identity-test-inbox/check_config.py --live --deployed

