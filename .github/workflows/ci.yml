      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      BILLING_SERVICE_KEY: ${{ secrets.BILLING_SERVICE_KEY }}
      AMAIL_STAGING_ISSUER_REPAIR_CONFIRM: ${{ inputs.confirm }}
      AMAIL_STAGING_DEPLOY_CONFIRM: RUN_STAGING_V020
      AMAIL_EXPECTED_WORKER_VERSION: 1f4a056f-5342-46a5-8e32-7eebaea5f7a2
      AMAIL_EXPECTED_MAINTENANCE_VERSION: 5281d8ef-f3c0-42d4-8331-bafa01923b40
      AMAIL_EXPECTED_TRACE_SINK_VERSION: 56c17824-679f-4427-bcc9-4584d2510208
      AMAIL_TRACE_QUEUE_ID: fcee510036af42c189e28c0b6ff9508e
      AMAIL_TRACE_DLQ_ID: f023f804b7bd4d8691fbfcb60416a001
      AMAIL_TRACE_TOPOLOGY: api-scheduled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.worker-build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Restore exact same-run tested modules
        run: python infra/ci/worker_artifact.py restore
