# 中文：在 GitHub 托管的运行器上验证全部平台；本地开发机不执行重型构建。
# English: Validate supported platforms on GitHub-hosted runners, not the developer workstation.
name: CI and deploy

on:
  pull_request:
  push:
    branches: [main, codex/amail-v0.1.0, codex/v0.1.2-agent-first-performance]
    # Skip only non-build documentation; PR/manual/release checks remain independent.
    # A skipped push supplies no exact-SHA CI result or acceptance/release artifact.
    paths-ignore:
      - 'README.md'
      - 'docs/**.md'
      - '.agents/skills/**.md'
  workflow_dispatch:
    inputs:
      target:
        description: Run non-deploying checks, deploy staging, or promote production after review
        required: true
        type: choice
        options: [checks, staging-inspect, staging, staging-e2e, production, production-api-only-maintenance, production-fresh-bootstrap, production-fresh-online]
      confirm:
        description: Documented RUN_* confirmation; production bootstrap or api-only maintenance is explicit
        required: false
        type: string
      trace_containment_run:
        description: Successful immutable staging capture-off attestation run
        required: false
        type: string
      trace_containment_kind:
        description: Capture-off evidence format; settings correction does not redeploy code
        required: false
        default: deploy-v1
        type: choice
        options: [deploy-v1, settings-v1]
      expected_worker_version:
        description: Exact staging Worker version bound to the containment attestation
        required: false
        type: string
      fresh_bootstrap_run:
        description: "Bootstrap resume: failed owned run; online: paused run ID or paused-run:failed-online-run for owned checkpoint completion"
        required: false
        type: string

      production_graph_freeze:
        description: Production requires FREEZE_PRODUCTION_GRAPH_WRITERS and the phase-specific confirm
        required: false
        type: string


permissions:
  contents: read

# Checks can supersede obsolete checks; shared-state manual operations never cancel each other.
# Keep the existing manual group so in-flight acceptance remains mutually exclusive.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'production' || inputs.target == 'production-api-only-maintenance' || inputs.target == 'production-fresh-bootstrap' || inputs.target == 'production-fresh-online') && 'amail-production-graph-writer' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'staging-e2e' || inputs.target == 'staging-inspect')) && 'amail-staging-graph-writer' || format('ci-{0}{1}', (github.event_name != 'workflow_dispatch' || inputs.target == 'checks') && 'checks-' || '', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'checks' }}

jobs:
  production-fresh-bootstrap:
    # A separate paused first receipt never invokes established activation lanes.
    name: Fresh held production bootstrap
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.target == 'production-fresh-bootstrap' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      inputs.confirm == 'RUN_FRESH_HELD_PRODUCTION_BOOTSTRAP' &&
      inputs.production_graph_freeze == 'FREEZE_PRODUCTION_GRAPH_WRITERS'
    needs: [cli, worker, worker-build, site, dns]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact same-run fully tested Worker modules
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.worker-build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Restore original compiler source run and all generated bytes
        run: python infra/ci/worker_artifact.py restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned deployment tools without provider capabilities
        run: |
          npm install --global wrangler@4.142.0
          python -m pip install --only-binary=:all: -r infra/deploy/production_inspection_requirements.txt
      - name: Create isolated held scope install reader first and persist exact paused receipt
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GH_TOKEN: ${{ github.token }}
          AMAIL_WORKER_ARTIFACT_ID: ${{ needs.worker-build.outputs.artifact_id }}
          AMAIL_PRODUCTION_BOOTSTRAP_CONFIRM: ${{ inputs.confirm }}
          AMAIL_FRESH_BOOTSTRAP_RUN_ID: ${{ inputs.fresh_bootstrap_run }}
          AMAIL_PRODUCTION_GRAPH_FREEZE: ${{ inputs.production_graph_freeze }}
          AMAIL_PRODUCTION_ENVIRONMENT: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INGRESS_SECRET: ${{ secrets.INGRESS_SECRET }}
          ROLE_FORWARD_DESTINATION: ${{ secrets.ROLE_FORWARD_DESTINATION }}
          AMAIL_TRACE_QUEUE_ID: ${{ vars.AMAIL_TRACE_QUEUE_ID_PRODUCTION }}
          AMAIL_TRACE_DLQ_ID: ${{ vars.AMAIL_TRACE_DLQ_ID_PRODUCTION }}
        run: python infra/deploy/fresh_mail_bootstrap.py
      - name: Preserve first successful receipt only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mail-fresh-bootstrap-${{ github.run_id }}-1
          path: .temp/fresh-bootstrap/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Stage bounded Queue intent beside owned recovery journals
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('.temp/trace-queue-provision-production.json')
          if source.exists():
              if source.is_symlink() or not source.is_file() or source.stat().st_size > 65536:
                  raise SystemExit('fresh_queue_intent_unverified')
              target = Path('.temp/fresh-bootstrap/recovery/trace-queue-provision-production.json')
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists():
                  raise SystemExit('fresh_queue_intent_replay_refused')
              shutil.copyfile(source, target)
          PY
      - name: Preserve owned partial intent without secrets provider bodies or automatic retry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-fresh-bootstrap-recovery-${{ github.run_id }}-1
          path: |
            .temp/fresh-bootstrap/recovery/*.jsonl
            .temp/fresh-bootstrap/recovery/trace-queue-provision-production.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  production-fresh-online:
    # Complete only the admitted held scope; never re-enter storage creation.
    name: Fresh production online deployment
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.target == 'production-fresh-online' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      inputs.confirm == 'RUN_FRESH_PRODUCTION_ONLINE' &&
      inputs.production_graph_freeze == 'FREEZE_PRODUCTION_GRAPH_WRITERS'
    needs: [cli, worker, worker-build, site, dns]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact same-run fully tested Worker modules
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.worker-build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Restore original compiler source run and all generated bytes
        run: python infra/ci/worker_artifact.py restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned deployment tools without provider capabilities
        run: |
          npm install --global wrangler@4.142.0
          python -m pip install --only-binary=:all: -r infra/deploy/production_inspection_requirements.txt -r infra/dns/requirements.txt
      - name: Complete the verified held production scope and persist the online receipt
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GH_TOKEN: ${{ github.token }}
          AMAIL_WORKER_ARTIFACT_ID: ${{ needs.worker-build.outputs.artifact_id }}
          AMAIL_FRESH_BOOTSTRAP_RUN_ID: ${{ inputs.fresh_bootstrap_run }}
          AMAIL_PRODUCTION_ONLINE_CONFIRM: ${{ inputs.confirm }}
          AMAIL_PRODUCTION_GRAPH_FREEZE: ${{ inputs.production_graph_freeze }}
          AMAIL_PRODUCTION_ENVIRONMENT: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INGRESS_SECRET: ${{ secrets.INGRESS_SECRET }}
          ROLE_FORWARD_DESTINATION: ${{ secrets.ROLE_FORWARD_DESTINATION }}
          AMAIL_TRACE_QUEUE_ID: ${{ vars.AMAIL_TRACE_QUEUE_ID_PRODUCTION }}
          AMAIL_TRACE_DLQ_ID: ${{ vars.AMAIL_TRACE_DLQ_ID_PRODUCTION }}
        run: python infra/deploy/complete_fresh_mail.py
      - name: Preserve first successful receipt only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mail-fresh-online-${{ github.run_id }}-1
          path: .temp/fresh-online/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve bounded owned recovery without secrets provider bodies or automatic retry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-fresh-online-recovery-${{ github.run_id }}-1
          path: .temp/fresh-online/recovery
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  cli:
    name: CLI (${{ matrix.os }})
    # Standalone mail acceptance builds its own binary; source checks cover every PR.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging' || (inputs.target == 'production' || inputs.target == 'production-api-only-maintenance' || inputs.target == 'production-fresh-bootstrap' || inputs.target == 'production-fresh-online')))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore platform/compiler-aware CLI dependencies
        id: cli-dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cli-dependencies-v1
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0' || github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance') }}
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Test CLI
        run: cargo test -p amail --locked --all-targets
      - name: Check CLI help
        run: cargo run -p amail --locked -- --help
      - name: Build native release candidate for staging acceptance
        if: github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging') && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance'
        run: cargo build -p amail --locked --release
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging') && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance'
        with:
          python-version: '3.12'
      - name: Restore verified published v0.1.0 CLI baseline on the same hosted runner
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging') && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .temp/perf-baseline
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --dir .temp/perf-baseline \
            --pattern amail-v0.1.0-x86_64-unknown-linux-gnu.tar.gz --pattern SHA256SUMS
          cd .temp/perf-baseline
          grep -E '^[0-9a-f]{64}  amail-v0\.1\.0-x86_64-unknown-linux-gnu\.tar\.gz$' SHA256SUMS > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum --check selected.sha256
          tar -xzf amail-v0.1.0-x86_64-unknown-linux-gnu.tar.gz amail
          ./amail --version
      - name: Measure bounded CLI startup and long-tail synthetic ZIP cases
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging') && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance'
        shell: bash
        run: |
          mkdir -p .temp/performance
          python scripts/performance.py --binary target/release/amail --baseline .temp/perf-baseline/amail --output .temp/performance/cli.json
          cargo test -p amail --locked --release performance_microbench -- --ignored --nocapture | tee .temp/performance/cli-microbench.log
      - name: Preserve bounded CLI performance measurements
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging') && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance'
        uses: actions/upload-artifact@v4
        with:
          name: performance-cli-${{ github.run_id }}
          path: .temp/performance/
          if-no-files-found: error
          retention-days: 14
      - name: Package version-checked native CLI candidate
        if: github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging') && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance'
        run: python infra/ci/cli_candidate.py binary
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging') && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance'
        with:
          name: cli-candidate-native-${{ runner.os }}
          path: .temp/ci/cli-candidate/*
          if-no-files-found: error
          retention-days: 14

  cli-candidate:
    name: Assemble unpublished v0.1.2 staging acceptance bundle
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging') && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance'
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-candidate-native-*
          path: .temp/ci/cli-candidate
          merge-multiple: true
      - name: Verify native producer provenance and package the agent skill
        run: python infra/ci/cli_candidate.py assemble
      - name: Upload acceptance downloads without creating a Release or tag
        uses: actions/upload-artifact@v4
        with:
          name: cli-candidate-v0.1.2-${{ github.run_id }}
          path: .temp/ci/cli-candidate/*
          if-no-files-found: error
          retention-days: 14

  staging-inspect:
    name: Read isolated staging rollout predecessor
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging-inspect' && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance' && inputs.confirm == 'INSPECT_STAGING_V012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read reviewed staging capabilities without writes or payloads
        run: python infra/deploy/inspect_staging.py
      - name: Preserve bounded predecessor pins for rollout review
        uses: actions/upload-artifact@v4
        with:
          name: staging-predecessor-${{ github.run_id }}
          path: .temp/staging-predecessor.json
          if-no-files-found: error
          retention-days: 14

  staging-e2e:
    name: Hosted Windows native PKCE and SMTP to ZIP/search
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-e2e' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0' || github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance')
    runs-on: windows-latest
    environment: staging
    timeout-minutes: 40
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit staging probe confirmation
        env:
          AMAIL_STAGING_E2E_CONFIRM: ${{ inputs.confirm }}
        run: |
          if ($env:AMAIL_STAGING_E2E_CONFIRM -ne 'RUN_STAGING_E2E') {
            throw 'Explicit staging E2E confirmation required'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install browser and DPAPI adapters
        run: python -m pip install pywin32==312 websocket-client==1.9.2
      - name: Build tested amail binary on hosted Windows
        run: |
          rustup show active-toolchain
          cargo test -p amail --locked --all-targets
          cargo build -p amail --locked
      - name: Execute staging native and inbound-mail acceptance
        env:
          AMAIL_STAGING_E2E_CONFIRM: ${{ inputs.confirm }}
          STAGING_E2E_USERNAME: ${{ secrets.STAGING_E2E_USERNAME }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AMAIL_TEST_SMTP_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_hosted_e2e.py

  worker-build:
    name: Build and unit-check Rust Worker modules
    outputs:
      artifact_id: ${{ steps.modules.outputs.artifact-id }}
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging' || (inputs.target == 'production' || inputs.target == 'production-api-only-maintenance' || inputs.target == 'production-fresh-bootstrap' || inputs.target == 'production-fresh-online')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - name: Install workerd boundary-test dependencies
        working-directory: infra/tests/worker-boundary
        run: pnpm install --frozen-lockfile
      - name: Set up Rust Wasm target
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
      - name: Restore compiler-aware Rust dependency cache
        id: worker-dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: worker-dependencies-v1
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0' || github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance') }}
      - name: Fingerprint the pinned public bundler compiler
        id: compiler
        shell: bash
        run: |
          compiler=$({ rustc --version --verbose; cc --version; ldd --version; } | sha256sum | cut -d ' ' -f 1)
          echo "identity=$compiler" >> "$GITHUB_OUTPUT"
      - name: Restore pinned Worker check bundler
        id: worker-bundler-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/worker-build-check
          key: worker-build-check-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-0.8.5
      - name: Run privacy trace schema and sink contracts
        run: |
          cargo test -p amail-trace-schema --locked --all-targets
          cargo test -p amail-trace-sink --locked --all-targets
      - name: Compile privacy trace sink target
        run: cargo check -p amail-trace-sink --locked --target wasm32-unknown-unknown
      - name: Run Rust Worker unit tests
        run: cargo test -p amail-worker --locked --all-targets
      - name: Run Rust Email ingress contract tests
        run: cargo test -p amail-ingress --locked --all-targets
      - name: Run Rust sending lifecycle contract tests
        run: cargo test -p amail-events --locked --all-targets
      - name: Run staging Identity test inbox contract tests
        run: cargo test -p amail-identity-test-inbox --locked --all-targets
      - name: Run role monitor contract tests
        run: cargo test -p amail-role-monitor --locked --all-targets
      - name: Compile Worker target
        run: cargo check -p amail-worker --locked --target wasm32-unknown-unknown
      - name: Compile Email ingress target
        run: cargo check -p amail-ingress --locked --target wasm32-unknown-unknown
      - name: Compile Email lifecycle target
        run: cargo check -p amail-events --locked --target wasm32-unknown-unknown
      - name: Compile staging Identity test inbox target
        run: cargo check -p amail-identity-test-inbox --locked --target wasm32-unknown-unknown
      - name: Compile role monitor target
        run: cargo check -p amail-role-monitor --locked --target wasm32-unknown-unknown
      - name: Install workers-rs bundler
        if: steps.worker-bundler-cache.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.5 --locked --root "$GITHUB_WORKSPACE/.cache/worker-build-check"
      - name: Use isolated pinned check bundler
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.cache/worker-build-check/bin" >> "$GITHUB_PATH"
      - name: Bundle privacy trace sink
        working-directory: workers/trace-sink
        run: worker-build --release
      - name: Bundle Worker for Wrangler
        working-directory: crates/mail-worker
        run: worker-build --release
      - name: Bundle Rust Email ingress for Wrangler
        working-directory: workers/mail-ingress
        run: worker-build --release
      - name: Bundle Rust Email lifecycle consumer for Wrangler
        working-directory: workers/mail-events
        run: worker-build --release
      - name: Bundle staging Identity test inbox for Wrangler
        working-directory: workers/identity-test-inbox
        run: worker-build --release
      - name: Bundle role monitor for Wrangler
        working-directory: workers/role-monitor
        run: worker-build --release
      - name: Save trusted pinned check bundler
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0' || github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance') && steps.worker-bundler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/worker-build-check
          key: ${{ steps.worker-bundler-cache.outputs.cache-primary-key }}
      - name: Test actual built Worker boundaries in workerd
        working-directory: infra/tests/worker-boundary
        # Preserve the deleted Python runner's bounded wait using the platform.
        timeout-minutes: 15
        run: pnpm test
      - name: Measure bounded Worker search and ZIP microbenchmarks
        if: github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging') && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance'
        shell: bash
        run: |
          mkdir -p .temp/performance
          cargo test -p amail-worker --locked --release performance_microbench -- --ignored --nocapture | tee .temp/performance/worker-microbench.log
      - name: Preserve bounded Worker performance measurements
        if: github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging') && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance'
        uses: actions/upload-artifact@v4
        with:
          name: performance-worker-${{ github.run_id }}
          path: .temp/performance/
          if-no-files-found: error
          retention-days: 14
      - name: Assemble same-run public generated-module artifact
        run: python infra/ci/worker_artifact.py create
      - name: Publish modules for native tests, not release admission
        id: modules
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-native-modules-${{ github.sha }}
          path: .temp/ci/worker-built/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  worker:
    # Preserve this stable gate name for existing deployment/acceptance consumers.
    name: Rust Worker (Wasm)
    needs: worker-build
    if: >-
      always() && (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging' || (inputs.target == 'production' || inputs.target == 'production-api-only-maintenance' || inputs.target == 'production-fresh-bootstrap' || inputs.target == 'production-fresh-online')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require the integrated build and runtime checks to succeed
        env:
          BUILD_RESULT: ${{ needs.worker-build.result }}
        run: |
          test "$BUILD_RESULT" = success

  site:
    name: Astro release site
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging' || (inputs.target == 'production' || inputs.target == 'production-api-only-maintenance' || inputs.target == 'production-fresh-bootstrap' || inputs.target == 'production-fresh-online')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro and TypeScript
        run: pnpm check
      - name: Build static site
        run: pnpm build
      - name: Check default candidate copy and navigation
        run: pnpm check:release-state candidate
      - name: Measure bounded candidate site payload budget
        run: |
          mkdir -p ../.temp/performance
          node --test scripts/measure-performance.test.mjs
          node scripts/measure-performance.mjs > ../.temp/performance/site-candidate.json
      - name: Build published-state site without deploying
        env:
          AMAIL_RELEASE_STATE: published
        run: pnpm build
      - name: Check published copy and navigation
        run: pnpm check:release-state published

      - name: Measure bounded published compatibility site payload budget
        run: node scripts/measure-performance.mjs > ../.temp/performance/site-published.json
      - name: Preserve site payload budgets
        uses: actions/upload-artifact@v4
        with:
          name: performance-site-${{ github.run_id }}
          path: .temp/performance/
          if-no-files-found: error
          retention-days: 14

  dns:
    name: Infrastructure probe unit tests
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging' || (inputs.target == 'production' || inputs.target == 'production-api-only-maintenance' || inputs.target == 'production-fresh-bootstrap' || inputs.target == 'production-fresh-online')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned hosted probe dependencies
        run: |
          python -m pip install --only-binary=:all: -r infra/dns/requirements.txt
      - name: Test deployment and sending safety contracts
        run: python -m unittest discover -s infra/tests -v
      - name: Test mail API observability privacy gate
        run: python -m unittest discover -s crates/mail-worker -p 'test_check_observability.py' -v
      - name: Check private staging Identity inbox config
        run: python workers/identity-test-inbox/check_config.py
      - name: Check staging isolation contract
        run: python infra/deploy/check_staging.py

  provider-live:
    name: OpenRouter 256D live contract
    # Synthetic provider calls belong to explicit promotion, not the fast source loop.
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || (inputs.target == 'production' || inputs.target == 'production-api-only-maintenance'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Qwen3 Embedding 8B with synthetic text
        run: python infra/provider/probe_openrouter.py

  deploy-worker:
    name: Deploy mail API
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'production' || inputs.target == 'production-api-only-maintenance') && github.ref == 'refs/heads/main'
    needs: [cli, worker, site, dns, provider-live, deploy-trace-sink, worker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: deploy-mail-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: crates/mail-worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AMAIL_TRACE_QUEUE_ID: ${{ needs.deploy-trace-sink.outputs.queue_id }}
      AMAIL_TRACE_DLQ_ID: ${{ needs.deploy-trace-sink.outputs.dlq_id }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      INGRESS_SECRET: ${{ secrets.INGRESS_SECRET }}
      ROLE_FORWARD_DESTINATION: ${{ secrets.ROLE_FORWARD_DESTINATION }}
      AMAIL_EXPECTED_WORKER_VERSION: ${{ vars.AMAIL_MAIL_VERSION_PRODUCTION }}
      AMAIL_EXPECTED_TRACE_SINK_VERSION: ${{ needs.deploy-trace-sink.outputs.sink_version }}
      AMAIL_TRACE_TOPOLOGY: api-only
    steps:
      - name: Verify deployment secrets before installing tools
        working-directory: .
        shell: bash
        run: |
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN OPENROUTER_API_KEY CF_EMAIL_ROUTING_TOKEN CF_ZONE_ID INGRESS_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing deployment value $key"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Download exact tested same-run Worker modules
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.worker-build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Verify source run compiler and every generated byte before provider changes
        working-directory: .
        run: python infra/ci/worker_artifact.py restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deploy tools
        run: |
          npm install --global wrangler@4.142.0
          python -m pip install -r ../../infra/dns/requirements.txt
      - name: Verify authoritative Email Sending DNS
        working-directory: .
        run: python infra/dns/verify_sending.py
      - name: Recheck strict maintenance graph before schema or provider changes
        if: inputs.target == 'production-api-only-maintenance'
        working-directory: .
        run: python infra/deploy/check_production_role_graph.py --phase api-only
      - name: Disable and verify user-domain Email preview and partial suppression drops
        working-directory: .
        run: python infra/provider/configure_sending_privacy.py --target production
      - name: Verify runtime Email Routing Rules read access
        working-directory: .
        run: python infra/provider/probe_routing.py
      - name: Apply remote D1 migrations
        run: wrangler d1 migrations apply MAIL_DB --remote
      - name: Recheck exact maintenance graph immediately before Mail replacement
        if: inputs.target == 'production-api-only-maintenance'
        working-directory: .
        run: python infra/deploy/check_production_role_graph.py --phase api-only
      - name: Deploy mail Worker with redacted output and exact recovery version
        id: api
        working-directory: .
        run: python infra/deploy/deploy_production_mail.py
      - name: Verify exact graph phase, serving bindings, capture and held sending
        working-directory: .
        env:
          AMAIL_EXPECTED_WORKER_VERSION: ${{ steps.api.outputs.version }}
        shell: bash
        run: |
          python infra/deploy/check_production_role_graph.py --phase api-only
          echo "production_trace_graph_attestation=api-only-v1 source=${{ steps.api.outputs.version }} sink=$AMAIL_EXPECTED_TRACE_SINK_VERSION queue=$AMAIL_TRACE_QUEUE_ID dlq=$AMAIL_TRACE_DLQ_ID"
      - name: Smoke test deployed API
        working-directory: .
        shell: bash
        # 中文：首次自定义域名发布可能短暂遇到 DNS/TLS 传播；仅重试幂等健康 GET。
        # English: First custom-domain publication can briefly race DNS/TLS propagation; retry only an idempotent health GET.
        run: curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --max-time 10 https://mail.moesegfault.dev/health

  deploy-ingress:
    name: Deploy Rust SMTP ingress
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    needs: [deploy-worker, worker, worker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: deploy-ingress-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/mail-ingress
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INGRESS_SECRET: ${{ secrets.INGRESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact tested same-run Worker modules
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.worker-build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Verify source run compiler and every generated byte before provider changes
        working-directory: .
        run: python infra/ci/worker_artifact.py restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Wrangler
        run: |
          npm install --global wrangler@4.142.0
      - name: Deploy Rust Email-event Worker with shared secret
        shell: bash
        run: |
          test -n "$INGRESS_SECRET"
          umask 077
          mkdir -p ../../.temp
          trap 'rm -f ../../.temp/ingress-secrets.json' EXIT
          node -e 'const fs = require("fs"); fs.writeFileSync("../../.temp/ingress-secrets.json", JSON.stringify({INGRESS_SECRET: process.env.INGRESS_SECRET}));'
          wrangler deploy --secrets-file ../../.temp/ingress-secrets.json

  deploy-events:
    name: Deploy Rust sending lifecycle consumer
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    needs: [deploy-worker, worker, worker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: deploy-events-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/mail-events
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact tested same-run Worker modules
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.worker-build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Verify source run compiler and every generated byte before provider changes
        working-directory: .
        run: python infra/ci/worker_artifact.py restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Wrangler
        run: |
          npm install --global wrangler@4.142.0
      - name: Ensure production lifecycle Queue and DLQ
        working-directory: .
        run: python infra/deploy/ensure_email_events.py --target production --phase queues
      - name: Deploy production lifecycle consumer
        run: wrangler deploy
      - name: Ensure production Email Sending Event Subscription
        working-directory: .
        run: python infra/deploy/ensure_email_events.py --target production --phase subscription

  release-ready:
    name: Gate public site on verified published release
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check matching published and attested GitHub Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("site/package.json"))["version"])')
          tag="v$version"
          release=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          tag_sha=$(git rev-parse "refs/tags/$tag^{commit}" 2>/dev/null || true)
          ready=false
          if [ "$release" = false ] && [ -n "$tag_sha" ] && git merge-base --is-ancestor "$tag_sha" HEAD; then
            mkdir -p .temp/release-published
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir .temp/release-published
            python infra/release/verify_published_assets.py .temp/release-published "$tag" \
              --repo "$GITHUB_REPOSITORY" --source-digest "$tag_sha"
            ready=true
          fi
          if [ "$ready" = true ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "Public site deferred: matching published tag or attested Release is unavailable"
          fi

  deploy-site:
    name: Deploy release site
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main' && needs.release-ready.outputs.ready == 'true'
    needs: [deploy-ingress, deploy-events, site, release-ready]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-site-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        env:
          AMAIL_RELEASE_STATE: published
        run: pnpm build
      - name: Verify published site copy before production deploy
        run: pnpm check:release-state published
      - name: Deploy Astro assets to Workers
        run: pnpm run deploy
      - name: Smoke test published pages
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .temp
          smoke_dir=$(mktemp -d .temp/site-smoke.XXXXXX)
          trap 'rm -f -- "$smoke_dir"/*.html "$smoke_dir"/*.headers; rmdir -- "$smoke_dir"' EXIT
          # One GET per exact public route; curl does not follow redirects.
          for route in home manual changelog; do
            path=/
            if [ "$route" != home ]; then path="/$route/"; fi
            status=$(curl --fail --silent --show-error --retry 6 --retry-delay 5 \
              --dump-header "$smoke_dir/$route.headers" --output "$smoke_dir/$route.html" \
              --write-out '%{http_code}' "https://amail.moesegfault.dev$path")
            if [ "$status" != 200 ]; then
              echo "::error::$route: expected HTTP 200, got $status"
              exit 1
            fi
          done
          python - "$smoke_dir" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import sys

          class Anchors(HTMLParser):
              """Collect actual anchor href attributes, excluding lookalike attributes."""

              def __init__(self):
                  super().__init__()
                  self.hrefs = set()

              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      self.hrefs.update(value for name, value in attrs if name == 'href')

          pages = {
              'home': ('v0.1.0 已发布', 'v0.1.0 尚未发布'),
              'manual': ('v0.1.0 已发布', 'v0.1.0 尚未开放下载'),
              'changelog': ('v0.1.0 已正式发布', 'v0.1.0 仍在验收'),
          }
          tag_url = 'https://github.com/kleedaisuki/moesegfault-amail/releases/tag/v0.1.0'
          root = Path(sys.argv[1])
          for route, (published, candidate) in pages.items():
              html = (root / f'{route}.html').read_text(encoding='utf-8')
              headers = (root / f'{route}.headers').read_text(encoding='utf-8')
              anchors = Anchors()
              anchors.feed(html)
              if published not in html or candidate in html or tag_url not in anchors.hrefs:
                  raise SystemExit(f'::error::{route}: published copy or exact Release href is missing, or candidate copy remains')
              if re.search('noindex', html, re.IGNORECASE) or re.search(r'^x-robots-tag\s*:[^\r\n]*\bnoindex\b', headers, re.IGNORECASE | re.MULTILINE):
                  raise SystemExit(f'::error::{route}: production response must be indexable')
          PY

  staging-site:
    name: Deploy isolated staging release site
    # Staging is an explicit promotion, never a side effect of a source push.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance' && inputs.confirm == 'RUN_STAGING_V012'
    needs: [site, staging-events]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-site-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify site deploy credentials
        working-directory: .
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build launch site
        run: pnpm build
      - name: Verify staging candidate copy before deploy
        run: pnpm check:release-state candidate
      - name: Deploy isolated staging Worker
        run: pnpm run deploy:staging
      - name: Smoke test staging launch pages
        working-directory: .
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 https://amail-staging.moesegfault.dev/ > /dev/null
          curl --fail --silent --show-error https://amail-staging.moesegfault.dev/manual/ > /dev/null
          curl --fail --silent --show-error https://amail-staging.moesegfault.dev/changelog/ > /dev/null
          headers=$(curl --fail --silent --show-error --head https://amail-staging.moesegfault.dev/)
          if ! grep -iq '^x-robots-tag:.*noindex' <<< "$headers"; then
            echo '::error::Staging launch page must be noindex'
            exit 1
          fi

  staging-worker:
    name: Deploy isolated staging mail API
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance' && inputs.confirm == 'RUN_STAGING_V012'
    needs: [cli, worker, site, dns, provider-live, staging-trace-sink, worker-build]
    permissions:
      contents: read
      actions: read
    outputs:
      api_version: ${{ steps.api.outputs.version }}
      maintenance_version: ${{ steps.maintenance.outputs.maintenance_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: staging
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    defaults:
      run:
        working-directory: crates/mail-worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AMAIL_TRACE_QUEUE_ID: ${{ needs.staging-trace-sink.outputs.queue_id }}
      AMAIL_TRACE_DLQ_ID: ${{ needs.staging-trace-sink.outputs.dlq_id }}
      GH_TOKEN: ${{ github.token }}
      AMAIL_TRACE_CONTAINMENT_RUN: ${{ inputs.trace_containment_run }}
      AMAIL_TRACE_CONTAINMENT_KIND: ${{ inputs.trace_containment_kind }}
      AMAIL_TRACE_CONTAINMENT_VERSION: ${{ inputs.expected_worker_version }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      INGRESS_SECRET: ${{ secrets.INGRESS_SECRET_STAGING }}
      MAIL_SENDING_DOMAIN: mail-staging.moesegfault.dev
      AMAIL_TRACE_TOPOLOGY: api-scheduled
      AMAIL_STAGING_MAIL_DEPLOY_CONFIRM: ${{ inputs.confirm }}
      AMAIL_STAGING_DEPLOY_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Verify staging secrets before installing tools
        working-directory: .
        shell: bash
        run: |
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN OPENROUTER_API_KEY CF_EMAIL_ROUTING_TOKEN INGRESS_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing staging deployment value $key"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Download exact tested same-run Worker modules
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.worker-build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Verify source run compiler and every generated byte before provider changes
        working-directory: .
        run: python infra/ci/worker_artifact.py restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify staging resource isolation
        run: python ../../infra/deploy/check_staging.py
      - name: Install deploy tools
        run: |
          npm install --global wrangler@4.142.0
          python -m pip install -r ../../infra/dns/requirements.txt
      - name: Verify staging authoritative Email Sending DNS
        working-directory: .
        run: python infra/dns/verify_sending.py
      - name: Require established staging global hold before provider or schema changes
        working-directory: .
        run: python infra/operator/check_send_hold.py --target staging
      - name: Disable and verify staging user-domain preview and partial suppression drops
        working-directory: .
        run: python infra/provider/configure_sending_privacy.py --target staging
      - name: Verify staging runtime Email Routing Rules read access
        working-directory: .
        run: python infra/provider/probe_routing.py
      - name: Restore same-run staging predecessor before scheduling cutover
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-rollout-predecessor-${{ github.run_id }}
          path: .temp
      - name: Recheck exact predecessor API before schema and provider writes
        working-directory: .
        run: python infra/deploy/staging_rollout.py before-api
      - name: Apply staging D1 migrations only
        run: wrangler d1 migrations apply MAIL_DB --remote --env staging
      - name: Recheck staging global hold immediately before Mail replacement
        working-directory: .
        run: python infra/operator/check_send_hold.py --target staging
      - name: Deploy staging Worker with redacted output and exact recovery version
        id: api
        working-directory: .
        run: python infra/deploy/deploy_production_mail.py --target staging
      - name: Pin new staging Mail immutable bindings and capture-off state
        working-directory: .
        env:
          AMAIL_EXPECTED_WORKER_VERSION: ${{ steps.api.outputs.version }}
          AMAIL_EXPECTED_TRACE_QUEUE_ID: ${{ needs.staging-trace-sink.outputs.queue_id }}
        run: python infra/deploy/pin_staging_mail.py --phase queue-api
      - name: Verify deployed staging mail API observability privacy boundary
        run: python check_observability.py --realm staging
      - name: Recheck exact staging sink privacy after Mail deployment
        working-directory: .
        env:
          AMAIL_EXPECTED_TRACE_SINK_VERSION: ${{ needs.staging-trace-sink.outputs.sink_version }}
        run: python crates/mail-worker/check_observability.py --realm staging --mode sink
      - name: Replace scheduled-only maintenance with bounded legacy cutover
        id: maintenance
        working-directory: .
        env:
          AMAIL_EXPECTED_WORKER_VERSION: ${{ steps.api.outputs.version }}
          AMAIL_EXPECTED_TRACE_SINK_VERSION: ${{ needs.staging-trace-sink.outputs.sink_version }}
        run: python infra/deploy/staging_rollout.py cutover
      - name: Verify exact active API and scheduled-maintenance trace producer graph
        working-directory: .
        env:
          AMAIL_EXPECTED_WORKER_VERSION: ${{ steps.api.outputs.version }}
          AMAIL_EXPECTED_MAINTENANCE_VERSION: ${{ steps.maintenance.outputs.maintenance_version }}
          AMAIL_EXPECTED_TRACE_SINK_VERSION: ${{ needs.staging-trace-sink.outputs.sink_version }}
        run: python infra/deploy/check_mail_split_graph.py --realm staging --state active
      - name: Preserve bounded legacy cutover witness without mailbox data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-cutover-${{ github.run_id }}
          path: .temp/staging-cutover.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify staging public sending remains held after graph readback
        working-directory: .
        run: python infra/operator/check_send_hold.py --target staging
      - name: Smoke test staging API
        working-directory: .
        shell: bash
        # 中文：仅健康 GET 可重试所有网络错误，避免首发 DNS 传播造成误报。
        # English: Retry all network errors only for the health GET, avoiding false first-deploy DNS failures.
        run: curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --max-time 10 https://mail-staging.moesegfault.dev/health

  staging-ingress:
    name: Deploy isolated Rust staging SMTP ingress
    # Staging is an explicit promotion, never a side effect of a source push.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && github.ref == 'refs/heads/codex/v0.1.2-agent-first-performance' && inputs.confirm == 'RUN_STAGING_V012'
    needs: [staging-worker, worker, worker-build]
    outputs:
      version: ${{ steps.ingress.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: staging
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/mail-ingress
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INGRESS_SECRET: ${{ secrets.INGRESS_SECRET_STAGING }}
      AMAIL_STAGING_DEPLOY_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact tested same-run Worker modules
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.worker-build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Verify source run compiler and every generated byte before provider changes
        working-directory: .
        run: python infra/ci/worker_artifact.py restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Wrangler
        run: |
          npm install --global wrangler@4.142.0
      - name: Deploy staging Rust Email-event Worker with exact recovery pin
        id: ingress
        working-directory: .
        run: python infra/deploy/deploy_staging_adapter.py --component ingress

  staging-events:
    name: Deploy isolated Rust staging lifecycle consumer
