# 中文：在 GitHub 托管的运行器上验证全部平台；本地开发机不执行重型构建。
# English: Validate supported platforms on GitHub-hosted runners, not the developer workstation.
name: CI and deploy

on:
  pull_request:
  push:
    branches: [main, codex/amail-v0.1.0]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy staging, or promote production Workers from main after staging review
        required: true
        type: choice
        options: [staging, staging-e2e, staging-prior-alias-reconcile, staging-hosted-alias-reconcile, staging-fifth-mail-audit, staging-fifth-mail-cleanup, staging-serving-pin, staging-routing-policy, staging-routing-write-probe, staging-routing-write-recover, staging-routing-write-audit, staging-routing-diagnostic, staging-current-address-diagnostic, staging-fourth-invocation-metrics, staging-role-smtp, staging-role-timeout-audit, staging-role-token-phase-probe, staging-role-phase-logs, staging-trace-canary, staging-trace-security-events, production]
      confirm:
        description: Staging E2E, role SMTP, or trace canary requires its documented RUN_* confirmation
        required: false
        type: string
      role_deploy_run:
        description: Successful staging CI run ID that deployed the current role Worker; role SMTP only
        required: false
        type: string
      role_probe_run_id:
        description: Historical failed role SMTP run ID; role timeout read-only audit only
        required: false
        type: string
      role_version:
        description: Pin the current 100%-serving role Worker version UUID; role SMTP only
        required: false
        type: string
      role_freeze:
        description: For role SMTP enter FREEZE_STAGING_ROLE_DEPLOYS after enforcing external deploy freeze
        required: false
        type: string
      trace_mode:
        description: For staging-trace-canary only; preflight does not log in
        required: false
        default: preflight
        type: choice
        options: [preflight, canary]
      semantic:
        description: Also check semantic search on the same two staging-e2e messages
        required: false
        default: false
        type: boolean
      expected_worker_version:
        description: Expected 100%-serving staging Mail Worker Version ID; staging-serving-pin only
        required: false
        type: string
      alias_run_id:
        description: Completed hosted staging-e2e GitHub run ID to reconcile; no address is accepted
        required: false
        type: string
      alias_attempt:
        description: GitHub run attempt for that exact staging-e2e run
        required: false
        type: string
      routing_probe_run_id:
        description: Original one-use routing Write probe run ID for recovery or delayed audit
        required: false
        type: string
      routing_probe_attempt:
        description: Original one-use routing Write probe attempt for recovery or delayed audit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    # Manual diagnostic jobs run independently; do not duplicate the full test matrix.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.head_ref != 'codex/amail-v0.1.0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Update stable Rust toolchain
        run: rustup update stable
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Test CLI
        run: cargo test -p amail --locked --all-targets
      - name: Check CLI help
        run: cargo run -p amail --locked -- --help
      - name: Upload tested Windows binary for staging live smoke
        if: matrix.os == 'windows-latest' && github.event_name == 'push' && github.ref == 'refs/heads/codex/amail-v0.1.0'
        uses: actions/upload-artifact@v4
        with:
          name: amail-windows-smoke-${{ github.sha }}
          path: target/debug/amail.exe
          if-no-files-found: error
          retention-days: 3

  staging-e2e:
    name: Hosted Windows native PKCE and SMTP to ZIP/search
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-e2e' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: windows-latest
    environment: staging
    timeout-minutes: 40
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit staging probe confirmation
        env:
          AMAIL_STAGING_E2E_CONFIRM: ${{ inputs.confirm }}
        run: |
          if ($env:AMAIL_STAGING_E2E_CONFIRM -ne 'RUN_STAGING_E2E') {
            throw 'Explicit staging E2E confirmation required'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install browser and DPAPI adapters
        run: python -m pip install pywin32==312 websocket-client==1.9.2
      - name: Build tested amail binary on hosted Windows
        run: |
          rustup update stable
          cargo test -p amail --locked --all-targets
          cargo build -p amail --locked
      - name: Execute staging native and inbound-mail acceptance
        env:
          AMAIL_STAGING_E2E_CONFIRM: ${{ inputs.confirm }}
          AMAIL_STAGING_SEMANTIC_E2E: ${{ inputs.semantic && '1' || '0' }}
          STAGING_E2E_USERNAME: ${{ secrets.STAGING_E2E_USERNAME }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AMAIL_TEST_SMTP_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_hosted_e2e.py

  staging-prior-alias-reconcile:
    name: Read-only reconciliation of two prior staging aliases
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-prior-alias-reconcile' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    concurrency:
      group: staging-prior-alias-reconcile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Require explicit read-only reconciliation confirmation
        env:
          RECONCILE_CONFIRM: ${{ inputs.confirm }}
        shell: pwsh
        run: |
          if ($env:RECONCILE_CONFIRM -ne 'READ_PRIOR_STAGING_ALIASES') {
            throw 'Explicit prior-alias reconciliation confirmation required'
          }
      - name: Check exact prior aliases without mutation
        env:
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_prior_alias_reconcile.py READ_PRIOR_STAGING_ALIASES

  staging-serving-pin:
    name: Read-only pin of 100%-serving staging Mail Worker
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-serving-pin' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    concurrency:
      group: staging-serving-pin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read serving deployment, settings and bindings without mutation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AMAIL_EXPECTED_WORKER_VERSION: ${{ inputs.expected_worker_version }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/deploy/pin_staging_mail.py

  staging-hosted-alias-reconcile:
    name: Read-only reconciliation of one hosted staging alias
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-hosted-alias-reconcile' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    concurrency:
      group: staging-hosted-alias-reconcile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Require explicit exact-run read confirmation
        shell: pwsh
        env:
          RECONCILE_CONFIRM: ${{ inputs.confirm }}
          ALIAS_RUN_ID: ${{ inputs.alias_run_id }}
          ALIAS_ATTEMPT: ${{ inputs.alias_attempt }}
        run: |
          if ($env:RECONCILE_CONFIRM -ne 'READ_ONE_STAGING_ALIAS' -or
              $env:ALIAS_RUN_ID -notmatch '^[1-9][0-9]{0,19}$' -or
              $env:ALIAS_ATTEMPT -notmatch '^[1-9][0-9]{0,2}$') {
            throw 'Explicit exact-run read confirmation and valid GitHub run coordinates required'
          }
      - name: Read exact alias routing and D1 state without mutation
        env:
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS_RUN_ID: ${{ inputs.alias_run_id }}
          ALIAS_ATTEMPT: ${{ inputs.alias_attempt }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: pwsh
        run: python infra/tests/staging_hosted_alias_reconcile.py READ_ONE_STAGING_ALIAS $env:ALIAS_RUN_ID $env:ALIAS_ATTEMPT

  staging-routing-policy:
    name: Read configured staging routing-token policy
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-routing-policy' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect only token verification and details GETs
        run: python infra/provider/probe_routing_write.py

  staging-fifth-mail-audit:
    name: Read-only aggregate audit of fifth hosted E2E mail
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-fifth-mail-audit' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    concurrency:
      group: staging-fifth-mail-audit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Require exact-run aggregate-read confirmation
        shell: pwsh
        env:
          AUDIT_CONFIRM: ${{ inputs.confirm }}
          ALIAS_RUN_ID: ${{ inputs.alias_run_id }}
          ALIAS_ATTEMPT: ${{ inputs.alias_attempt }}
        run: |
          if ($env:AUDIT_CONFIRM -ne 'READ_FIFTH_MAIL_AGGREGATES' -or
              $env:ALIAS_RUN_ID -ne '36589042183' -or
              $env:ALIAS_ATTEMPT -ne '1') {
            throw 'Exact fifth-run aggregate-read confirmation required'
          }
      - name: Read exact D1 aggregates and route absence only
        shell: pwsh
        env:
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS_RUN_ID: ${{ inputs.alias_run_id }}
          ALIAS_ATTEMPT: ${{ inputs.alias_attempt }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_fifth_mail_audit.py READ_FIFTH_MAIL_AGGREGATES $env:ALIAS_RUN_ID $env:ALIAS_ATTEMPT

  staging-fifth-mail-cleanup:
    name: Guarded one-shot cleanup of fifth hosted mail fixtures
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-fifth-mail-cleanup' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: windows-latest
    environment: staging
    timeout-minutes: 45
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Require exact-run destructive confirmation before accessing secrets
        env:
          CLEANUP_CONFIRM: ${{ inputs.confirm }}
          ALIAS_RUN_ID: ${{ inputs.alias_run_id }}
          ALIAS_ATTEMPT: ${{ inputs.alias_attempt }}
        run: |
          if ($env:CLEANUP_CONFIRM -ne 'DELETE_FIFTH_MAIL_EXACT_FIXTURES' -or
              $env:ALIAS_RUN_ID -ne '36589042183' -or
              $env:ALIAS_ATTEMPT -ne '1') {
            throw 'Exact fifth-run fixture cleanup confirmation required'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install native browser and DPAPI adapters
        run: python -m pip install pywin32==312 websocket-client==1.9.2
      - name: Build native amail CLI
        run: |
          rustup update stable
          cargo build -p amail --locked
      - name: Verify exact fixtures and delete only their owner-scoped CLI IDs
        env:
          STAGING_E2E_USERNAME: ${{ secrets.STAGING_E2E_USERNAME }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          AMAIL_EXPECTED_WORKER_VERSION: ${{ inputs.expected_worker_version }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_fifth_mail_cleanup.py DELETE_FIFTH_MAIL_EXACT_FIXTURES 36589042183 1

  staging-routing-write-probe:
    name: One valid disabled staging Routing Rules Write probe
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-routing-write-probe' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    timeout-minutes: 5
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create one disabled valid rule and remove only exact owned rule
        env:
          PROBE_CONFIRM: ${{ inputs.confirm }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/provider/probe_routing_effective_write.py probe "$PROBE_CONFIRM" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

  staging-routing-write-recover:
    name: Recover exact prior staging Routing Rules Write probe
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-routing-write-recover' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    timeout-minutes: 5
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read and clean only the original exact owned disabled rule
        env:
          PROBE_CONFIRM: ${{ inputs.confirm }}
          PROBE_RUN_ID: ${{ inputs.routing_probe_run_id }}
          PROBE_ATTEMPT: ${{ inputs.routing_probe_attempt }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/provider/probe_routing_effective_write.py recover "$PROBE_CONFIRM" "$PROBE_RUN_ID" "$PROBE_ATTEMPT"

  staging-routing-write-audit:
    name: Delayed read-only audit of exact staging Routing Rules probe
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-routing-write-audit' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    timeout-minutes: 5
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm exact candidate is still absent after cleanup
        env:
          PROBE_CONFIRM: ${{ inputs.confirm }}
          PROBE_RUN_ID: ${{ inputs.routing_probe_run_id }}
          PROBE_ATTEMPT: ${{ inputs.routing_probe_attempt }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/provider/probe_routing_effective_write.py audit "$PROBE_CONFIRM" "$PROBE_RUN_ID" "$PROBE_ATTEMPT"

  staging-routing-diagnostic:
    name: Classify retained staging address-add incident without mutation
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-routing-diagnostic' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    concurrency:
      group: staging-retained-routing-diagnostic
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Query only the hardcoded run-owned retained event window
        env:
          DIAGNOSTIC_CONFIRM: ${{ inputs.confirm }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_OBSERVABILITY_TOKEN: ${{ secrets.CF_OBSERVABILITY_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: pwsh
        run: |
          if ($env:DIAGNOSTIC_CONFIRM -ne 'READ_STAGING_ADDRESS_INCIDENT_36533465672') {
            throw 'Explicit read-only staging incident confirmation required'
          }
          python infra/tests/staging_address_failure_logs.py READ_STAGING_ADDRESS_INCIDENT_36533465672

  staging-current-address-diagnostic:
    name: Classify one current staging address-add incident without mutation
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-current-address-diagnostic' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    concurrency:
      group: staging-retained-routing-diagnostic
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Query only the current run's bounded retained event window
        env:
          DIAGNOSTIC_CONFIRM: ${{ inputs.confirm }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_OBSERVABILITY_TOKEN: ${{ secrets.CF_OBSERVABILITY_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: pwsh
        run: |
          if ($env:DIAGNOSTIC_CONFIRM -ne 'READ_STAGING_ADDRESS_INCIDENT_36553799873') {
            throw 'Explicit read-only staging incident confirmation required'
          }
          python infra/tests/staging_current_address_failure_logs.py READ_STAGING_ADDRESS_INCIDENT_36553799873

  staging-fourth-invocation-metrics:
    name: Read only fourth staging E2E Worker invocation metrics
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-fourth-invocation-metrics' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Query bounded aggregate status counters, never raw Worker logs
        env:
          DIAGNOSTIC_CONFIRM: ${{ inputs.confirm }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_OBSERVABILITY_TOKEN: ${{ secrets.CF_OBSERVABILITY_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python infra/provider/probe_staging_fourth_invocation_metrics.py "$DIAGNOSTIC_CONFIRM"

  staging-role-smtp:
    name: One guarded staging role-monitor SMTP probe
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-role-smtp' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    # Serialize with staging role deployments; the explicit external freeze
    # still covers out-of-band Wrangler and queued-run ambiguity.
    concurrency:
      group: deploy-role-monitor-staging
      cancel-in-progress: false
    env:
      CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Wrangler for restricted D1 readback
        run: npm install --global wrangler@4.142.0
      - name: Check deployed provenance and run one ID-bound SMTP probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AMAIL_STAGING_ROLE_CONFIRM: ${{ inputs.confirm }}
          AMAIL_STAGING_ROLE_FREEZE: ${{ inputs.role_freeze }}
          AMAIL_STAGING_ROLE_DEPLOY_RUN: ${{ inputs.role_deploy_run }}
          AMAIL_STAGING_ROLE_VERSION: ${{ inputs.role_version }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          # Existing staging token for guarded SMTP; sender read is not SMTP AUTH proof.
          AMAIL_TEST_SMTP_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python workers/role-monitor/hosted_acceptance.py

  staging-role-timeout-audit:
    name: Read-only aggregate audit of first role SMTP timeout
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-role-timeout-audit' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    concurrency:
      group: staging-role-timeout-audit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact historical run and read-only confirmation
        shell: pwsh
        env:
          AUDIT_CONFIRM: ${{ inputs.confirm }}
          ROLE_RUN_ID: ${{ inputs.role_probe_run_id }}
        run: |
          if ($env:AUDIT_CONFIRM -ne 'READ_FIRST_ROLE_SMTP_AGGREGATES' -or
              $env:ROLE_RUN_ID -ne '36603362864') {
            throw 'Exact first role SMTP read-only confirmation required'
          }
      - name: Read bounded role D1 aggregates and current provider state only
        env:
          CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          AMAIL_STAGING_ROLE_VERSION: ${{ inputs.role_version }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_role_timeout_audit.py READ_FIRST_ROLE_SMTP_AGGREGATES 36603362864

  staging-role-token-phase-probe:
    name: Read-only role routing token permission discriminator
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-role-token-phase-probe' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    concurrency:
      group: staging-role-token-phase-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact failed SMTP run and read-only confirmation
        shell: pwsh
        env:
          PROBE_CONFIRM: ${{ inputs.confirm }}
          ROLE_RUN_ID: ${{ inputs.role_probe_run_id }}
        run: |
          if ($env:PROBE_CONFIRM -ne 'READ_FIRST_ROLE_TOKEN_PERMISSIONS' -or
              $env:ROLE_RUN_ID -ne '36603362864') {
            throw 'Exact first role SMTP token-permission confirmation required'
          }
      - name: Read bounded provider inventories without disclosing destination
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          ROLE_FORWARD_DESTINATION: ${{ secrets.ROLE_FORWARD_DESTINATION }}
          AMAIL_STAGING_ROLE_VERSION: ${{ inputs.role_version }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_role_token_phase_probe.py READ_FIRST_ROLE_TOKEN_PERMISSIONS 36603362864

  staging-role-phase-logs:
    name: Read only historical first-role Cron application phase logs
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-role-phase-logs' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    concurrency:
      group: staging-role-phase-logs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact historical role run and read-only confirmation
        shell: pwsh
        env:
          PROBE_CONFIRM: ${{ inputs.confirm }}
          ROLE_RUN_ID: ${{ inputs.role_probe_run_id }}
        run: |
          if ($env:PROBE_CONFIRM -ne 'READ_FIRST_ROLE_PHASE_LOGS' -or
              $env:ROLE_RUN_ID -ne '36603362864') {
            throw 'Exact first role Cron phase-log confirmation required'
          }
      - name: Classify bounded retained application logs with no raw records
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_OBSERVABILITY_TOKEN: ${{ secrets.CF_OBSERVABILITY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_role_phase_logs.py READ_FIRST_ROLE_PHASE_LOGS 36603362864

  staging-trace-canary:
    name: Reuse branch-local staging retained-log trace canary
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-trace-canary' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    uses: ./.github/workflows/staging-trace-canary.yml
    with:
      mode: ${{ inputs.trace_mode }}
      confirm: ${{ inputs.confirm }}
    secrets: inherit

  staging-trace-security-events:
    name: Read only sampled Security Events for one staging trace incident
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-trace-security-events' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Classify one bounded, sampled zone-host event window
        env:
          CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DIAGNOSTIC_CONFIRM: ${{ inputs.confirm }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python infra/provider/probe_staging_trace_security_events.py "$DIAGNOSTIC_CONFIRM" 36671177226

  worker:
    name: Rust Worker (Wasm)
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.head_ref != 'codex/amail-v0.1.0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - name: Install workerd boundary-test dependencies
        working-directory: infra/tests/worker-boundary
        run: pnpm install --frozen-lockfile
      - name: Check installed Miniflare module contract before Rust build
        working-directory: infra/tests/worker-boundary
        run: node miniflare-config-smoke.mjs
      - name: Set up Rust Wasm target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - name: Run Rust Worker unit tests
        run: cargo test -p amail-worker --locked --all-targets
      - name: Run Rust Email ingress contract tests
        run: cargo test -p amail-ingress --locked --all-targets
      - name: Run Rust sending lifecycle contract tests
        run: cargo test -p amail-events --locked --all-targets
      - name: Run staging Identity test inbox contract tests
        run: cargo test -p amail-identity-test-inbox --locked --all-targets
      - name: Run role monitor contract tests
        run: cargo test -p amail-role-monitor --locked --all-targets
      - name: Compile Worker target
        run: cargo check -p amail-worker --locked --target wasm32-unknown-unknown
      - name: Compile Email ingress target
        run: cargo check -p amail-ingress --locked --target wasm32-unknown-unknown
      - name: Compile Email lifecycle target
        run: cargo check -p amail-events --locked --target wasm32-unknown-unknown
      - name: Compile staging Identity test inbox target
        run: cargo check -p amail-identity-test-inbox --locked --target wasm32-unknown-unknown
      - name: Compile role monitor target
        run: cargo check -p amail-role-monitor --locked --target wasm32-unknown-unknown
      - name: Install workers-rs bundler
        run: cargo install worker-build --version 0.8.5 --locked
      - name: Bundle Worker for Wrangler
        working-directory: crates/mail-worker
        run: worker-build --release
      - name: Run built Rust Worker address-add boundary tests in workerd
        working-directory: infra/tests/worker-boundary
        run: pnpm test
      - name: Bundle Rust Email ingress for Wrangler
        working-directory: workers/mail-ingress
        run: worker-build --release
      - name: Bundle Rust Email lifecycle consumer for Wrangler
        working-directory: workers/mail-events
        run: worker-build --release
      - name: Bundle staging Identity test inbox for Wrangler
        working-directory: workers/identity-test-inbox
        run: worker-build --release
      - name: Bundle role monitor for Wrangler
        working-directory: workers/role-monitor
        run: worker-build --release

  site:
    name: Astro release site
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.head_ref != 'codex/amail-v0.1.0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro and TypeScript
        run: pnpm check
      - name: Build static site
        run: pnpm build
      - name: Check default candidate copy and navigation
        run: pnpm check:release-state candidate
      - name: Build published-state site without deploying
        env:
          AMAIL_RELEASE_STATE: published
        run: pnpm build
      - name: Check published copy and navigation
        run: pnpm check:release-state published

  dns:
    name: Infrastructure probe unit tests
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.head_ref != 'codex/amail-v0.1.0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DNS verifier dependency
        run: python -m pip install -r infra/dns/requirements.txt
      - name: Test DNS and provider probes
        run: python -m unittest discover -s infra/tests -v
      - name: Test staging Identity exact-route safeguards
        run: python -m unittest discover -s workers/identity-test-inbox -p 'test_*.py' -v
      - name: Test staging role-monitor route safeguards
        run: python -m unittest discover -s workers/role-monitor -p 'test_*.py' -v
      - name: Test mail API observability privacy gate
        run: python -m unittest discover -s crates/mail-worker -p 'test_check_observability.py' -v
      - name: Check private staging Identity inbox config
        run: python workers/identity-test-inbox/check_config.py
      - name: Check staging isolation contract
        run: python infra/deploy/check_staging.py

  provider-live:
    name: OpenRouter 256D live contract
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Qwen3 Embedding 8B with synthetic text
        run: python infra/provider/probe_openrouter.py

  deploy-worker:
    name: Deploy mail API
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    needs: [cli, worker, site, dns, provider-live]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: deploy-mail-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: crates/mail-worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      INGRESS_SECRET: ${{ secrets.INGRESS_SECRET }}
    steps:
      - name: Verify deployment secrets before installing tools
        working-directory: .
        shell: bash
        run: |
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN OPENROUTER_API_KEY CF_EMAIL_ROUTING_TOKEN CF_ZONE_ID INGRESS_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing deployment value $key"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Set up Rust Wasm target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deploy tools
        run: |
          cargo install worker-build --version 0.8.3 --locked
          npm install --global wrangler@4.142.0
          python -m pip install -r ../../infra/dns/requirements.txt
      - name: Verify authoritative Email Sending DNS
        working-directory: .
        run: python infra/dns/verify_sending.py
      - name: Disable and verify user-domain Email preview and partial suppression drops
        working-directory: .
        run: python infra/provider/configure_sending_privacy.py --target production
      - name: Verify runtime Email Routing Rules read access
        working-directory: .
        run: python infra/provider/probe_routing.py
      - name: Apply remote D1 migrations
        run: wrangler d1 migrations apply MAIL_DB --remote
      - name: Build Rust Worker bundle
        run: worker-build --release
      - name: Deploy mail Worker with runtime secrets
        shell: bash
        run: |
          umask 077
          mkdir -p ../../.temp
          trap 'rm -f ../../.temp/worker-secrets.json' EXIT
          node -e 'const fs = require("fs"); const keys = ["OPENROUTER_API_KEY", "CF_EMAIL_ROUTING_TOKEN", "INGRESS_SECRET"]; fs.writeFileSync("../../.temp/worker-secrets.json", JSON.stringify(Object.fromEntries(keys.map(key => [key, process.env[key]]))));'
          wrangler deploy --secrets-file ../../.temp/worker-secrets.json
      - name: Verify deployed mail API observability privacy boundary
        run: python check_observability.py --realm production
      - name: Smoke test deployed API
        working-directory: .
        shell: bash
        # 中文：首次自定义域名发布可能短暂遇到 DNS/TLS 传播；仅重试幂等健康 GET。
        # English: First custom-domain publication can briefly race DNS/TLS propagation; retry only an idempotent health GET.
        run: curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --max-time 10 https://mail.moesegfault.dev/health

  deploy-ingress:
    name: Deploy Rust SMTP ingress
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: deploy-ingress-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/mail-ingress
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INGRESS_SECRET: ${{ secrets.INGRESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust Wasm target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust bundler and Wrangler
        run: |
          cargo install worker-build --version 0.8.5 --locked
          npm install --global wrangler@4.142.0
      - name: Build Rust Email ingress
        run: worker-build --release
      - name: Deploy Rust Email-event Worker with shared secret
        shell: bash
        run: |
          test -n "$INGRESS_SECRET"
          umask 077
          mkdir -p ../../.temp
          trap 'rm -f ../../.temp/ingress-secrets.json' EXIT
          node -e 'const fs = require("fs"); fs.writeFileSync("../../.temp/ingress-secrets.json", JSON.stringify({INGRESS_SECRET: process.env.INGRESS_SECRET}));'
          wrangler deploy --secrets-file ../../.temp/ingress-secrets.json

  deploy-events:
    name: Deploy Rust sending lifecycle consumer
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: deploy-events-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/mail-events
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust Wasm target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust bundler and Wrangler
        run: |
          cargo install worker-build --version 0.8.5 --locked
          npm install --global wrangler@4.142.0
      - name: Ensure production lifecycle Queue and DLQ
        working-directory: .
        run: python infra/deploy/ensure_email_events.py --target production --phase queues
      - name: Build Rust lifecycle consumer
        run: worker-build --release
      - name: Deploy production lifecycle consumer
        run: wrangler deploy
      - name: Ensure production Email Sending Event Subscription
        working-directory: .
        run: python infra/deploy/ensure_email_events.py --target production --phase subscription

  release-ready:
    name: Gate public site on verified published release
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check matching published and attested GitHub Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("site/package.json"))["version"])')
          tag="v$version"
          release=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          tag_sha=$(git rev-parse "refs/tags/$tag^{commit}" 2>/dev/null || true)
          ready=false
          if [ "$release" = false ] && [ -n "$tag_sha" ] && git merge-base --is-ancestor "$tag_sha" HEAD; then
            mkdir -p .temp/release-published
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir .temp/release-published
            python infra/release/verify_published_assets.py .temp/release-published "$tag" \
              --repo "$GITHUB_REPOSITORY" --source-digest "$tag_sha"
            ready=true
          fi
          if [ "$ready" = true ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "Public site deferred: matching published tag or attested Release is unavailable"
          fi

  deploy-site:
    name: Deploy release site
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main' && needs.release-ready.outputs.ready == 'true'
    needs: [deploy-ingress, deploy-events, site, release-ready]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-site-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        env:
          AMAIL_RELEASE_STATE: published
        run: pnpm build
      - name: Verify published site copy before production deploy
        run: pnpm check:release-state published
      - name: Deploy Astro assets to Workers
        run: pnpm run deploy
      - name: Smoke test published pages
        working-directory: .
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 https://amail.moesegfault.dev/ > /dev/null
          curl --fail --silent --show-error https://amail.moesegfault.dev/manual/ > /dev/null
          curl --fail --silent --show-error https://amail.moesegfault.dev/changelog/ > /dev/null
          home=$(curl --fail --silent --show-error https://amail.moesegfault.dev/)
          grep -Fq 'v0.1.0 已发布' <<< "$home"
          if grep -Fq 'v0.1.0 尚未发布' <<< "$home"; then
            echo '::error::Production site still claims the release is unpublished'
            exit 1
          fi
          headers=$(curl --fail --silent --show-error --head https://amail.moesegfault.dev/)
          if grep -iq '^x-robots-tag:.*noindex' <<< "$headers"; then
            echo '::error::Production launch page must be indexable'
            exit 1
          fi

  staging-site:
    name: Deploy isolated staging release site
    if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/amail-v0.1.0') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-site-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify site deploy credentials
        working-directory: .
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build launch site
        run: pnpm build
      - name: Verify staging candidate copy before deploy
        run: pnpm check:release-state candidate
      - name: Deploy isolated staging Worker
        run: pnpm run deploy:staging
      - name: Smoke test staging launch pages
        working-directory: .
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 https://amail-staging.moesegfault.dev/ > /dev/null
          curl --fail --silent --show-error https://amail-staging.moesegfault.dev/manual/ > /dev/null
          curl --fail --silent --show-error https://amail-staging.moesegfault.dev/changelog/ > /dev/null
          headers=$(curl --fail --silent --show-error --head https://amail-staging.moesegfault.dev/)
          if ! grep -iq '^x-robots-tag:.*noindex' <<< "$headers"; then
            echo '::error::Staging launch page must be noindex'
            exit 1
          fi

  staging-worker:
    name: Deploy isolated staging mail API
    if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/amail-v0.1.0') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    needs: [cli, worker, site, dns, provider-live]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    concurrency:
      group: deploy-mail-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: crates/mail-worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      INGRESS_SECRET: ${{ secrets.INGRESS_SECRET_STAGING }}
      MAIL_SENDING_DOMAIN: mail-staging.moesegfault.dev
    steps:
      - name: Verify staging secrets before installing tools
        working-directory: .
        shell: bash
        run: |
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN OPENROUTER_API_KEY CF_EMAIL_ROUTING_TOKEN INGRESS_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing staging deployment value $key"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Set up Rust Wasm target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify staging resource isolation
        run: python ../../infra/deploy/check_staging.py
      - name: Install deploy tools
        run: |
          cargo install worker-build --version 0.8.3 --locked
          npm install --global wrangler@4.142.0
          python -m pip install -r ../../infra/dns/requirements.txt
      - name: Verify staging authoritative Email Sending DNS
        working-directory: .
        run: python infra/dns/verify_sending.py
      - name: Disable and verify staging user-domain preview and partial suppression drops
        working-directory: .
        run: python infra/provider/configure_sending_privacy.py --target staging
      - name: Verify staging runtime Email Routing Rules read access
        working-directory: .
        run: python infra/provider/probe_routing.py
      - name: Apply staging D1 migrations only
        run: wrangler d1 migrations apply MAIL_DB --remote --env staging
      - name: Build Rust Worker bundle
        run: worker-build --release
      - name: Deploy staging Worker with isolated runtime secrets
        shell: bash
        run: |
          umask 077
          mkdir -p ../../.temp
          trap 'rm -f ../../.temp/worker-staging-secrets.json' EXIT
          node -e 'const fs = require("fs"); const keys = ["OPENROUTER_API_KEY", "CF_EMAIL_ROUTING_TOKEN", "INGRESS_SECRET"]; fs.writeFileSync("../../.temp/worker-staging-secrets.json", JSON.stringify(Object.fromEntries(keys.map(key => [key, process.env[key]]))));'
          wrangler deploy --env staging --secrets-file ../../.temp/worker-staging-secrets.json
      - name: Verify deployed staging mail API observability privacy boundary
        run: python check_observability.py --realm staging
      - name: Smoke test staging API
        working-directory: .
        shell: bash
        # 中文：仅健康 GET 可重试所有网络错误，避免首发 DNS 传播造成误报。
        # English: Retry all network errors only for the health GET, avoiding false first-deploy DNS failures.
        run: curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --max-time 10 https://mail-staging.moesegfault.dev/health

  staging-ingress:
    name: Deploy isolated Rust staging SMTP ingress
    if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/amail-v0.1.0') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
