# 中文：在 GitHub 托管的运行器上验证全部平台；本地开发机不执行重型构建。
# English: Validate supported platforms on GitHub-hosted runners, not the developer workstation.
name: CI and deploy

on:
  pull_request:
  push:
    branches: [main, codex/amail-v0.1.0]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy staging, or promote production Workers from main after staging review
        required: true
        type: choice
        options: [staging, staging-e2e, staging-routing-policy, staging-trace-canary, production]
      confirm:
        description: For staging-e2e enter RUN_STAGING_E2E; for trace canary enter RUN_STAGING_TRACE_CANARY
        required: false
        type: string
      trace_mode:
        description: For staging-trace-canary only; preflight does not log in
        required: false
        default: preflight
        type: choice
        options: [preflight, canary]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    # Manual diagnostic jobs run independently; do not duplicate the full test matrix.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.head_ref != 'codex/amail-v0.1.0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Update stable Rust toolchain
        run: rustup update stable
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Test CLI
        run: cargo test -p amail --locked --all-targets
      - name: Check CLI help
        run: cargo run -p amail --locked -- --help
      - name: Upload tested Windows binary for staging live smoke
        if: matrix.os == 'windows-latest' && github.event_name == 'push' && github.ref == 'refs/heads/codex/amail-v0.1.0'
        uses: actions/upload-artifact@v4
        with:
          name: amail-windows-smoke-${{ github.sha }}
          path: target/debug/amail.exe
          if-no-files-found: error
          retention-days: 3

  staging-e2e:
    name: Hosted Windows native PKCE and SMTP to ZIP/search
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-e2e' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: windows-latest
    environment: staging
    timeout-minutes: 40
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit staging probe confirmation
        env:
          AMAIL_STAGING_E2E_CONFIRM: ${{ inputs.confirm }}
        run: |
          if ($env:AMAIL_STAGING_E2E_CONFIRM -ne 'RUN_STAGING_E2E') {
            throw 'Explicit staging E2E confirmation required'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install browser and DPAPI adapters
        run: python -m pip install pywin32==312 websocket-client==1.9.2
      - name: Build tested amail binary on hosted Windows
        run: |
          rustup update stable
          cargo test -p amail --locked --all-targets
          cargo build -p amail --locked
      - name: Execute staging native and inbound-mail acceptance
        env:
          AMAIL_STAGING_E2E_CONFIRM: ${{ inputs.confirm }}
          STAGING_E2E_USERNAME: ${{ secrets.STAGING_E2E_USERNAME }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_hosted_e2e.py

  staging-routing-policy:
    name: Read configured staging routing-token policy
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-routing-policy' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect only token verification and details GETs
        run: python infra/provider/probe_routing_write.py

  staging-trace-canary:
    name: Reuse branch-local staging retained-log trace canary
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-trace-canary' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    uses: ./.github/workflows/staging-trace-canary.yml
    with:
      mode: ${{ inputs.trace_mode }}
      confirm: ${{ inputs.confirm }}
    secrets: inherit

  worker:
    name: Rust Worker (Wasm)
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.head_ref != 'codex/amail-v0.1.0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust Wasm target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - name: Run Rust Worker unit tests
        run: cargo test -p amail-worker --locked --all-targets
      - name: Run Rust Email ingress contract tests
        run: cargo test -p amail-ingress --locked --all-targets
      - name: Run Rust sending lifecycle contract tests
        run: cargo test -p amail-events --locked --all-targets
      - name: Run staging Identity test inbox contract tests
        run: cargo test -p amail-identity-test-inbox --locked --all-targets
      - name: Run role monitor contract tests
        run: cargo test -p amail-role-monitor --locked --all-targets
      - name: Compile Worker target
        run: cargo check -p amail-worker --locked --target wasm32-unknown-unknown
      - name: Compile Email ingress target
        run: cargo check -p amail-ingress --locked --target wasm32-unknown-unknown
      - name: Compile Email lifecycle target
        run: cargo check -p amail-events --locked --target wasm32-unknown-unknown
      - name: Compile staging Identity test inbox target
        run: cargo check -p amail-identity-test-inbox --locked --target wasm32-unknown-unknown
      - name: Compile role monitor target
        run: cargo check -p amail-role-monitor --locked --target wasm32-unknown-unknown
      - name: Install workers-rs bundler
        run: cargo install worker-build --version 0.8.5 --locked
      - name: Bundle Worker for Wrangler
        working-directory: crates/mail-worker
        run: worker-build --release
      - name: Bundle Rust Email ingress for Wrangler
        working-directory: workers/mail-ingress
        run: worker-build --release
      - name: Bundle Rust Email lifecycle consumer for Wrangler
        working-directory: workers/mail-events
        run: worker-build --release
      - name: Bundle staging Identity test inbox for Wrangler
        working-directory: workers/identity-test-inbox
        run: worker-build --release
      - name: Bundle role monitor for Wrangler
        working-directory: workers/role-monitor
        run: worker-build --release

  site:
    name: Astro release site
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.head_ref != 'codex/amail-v0.1.0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro and TypeScript
        run: pnpm check
      - name: Build static site
        run: pnpm build

  dns:
    name: Infrastructure probe unit tests
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.head_ref != 'codex/amail-v0.1.0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DNS verifier dependency
        run: python -m pip install -r infra/dns/requirements.txt
      - name: Test DNS and provider probes
        run: python -m unittest discover -s infra/tests -v
      - name: Test staging Identity exact-route safeguards
        run: python -m unittest discover -s workers/identity-test-inbox -p 'test_*.py' -v
      - name: Test staging role-monitor route safeguards
        run: python -m unittest discover -s workers/role-monitor -p 'test_*.py' -v
      - name: Test mail API observability privacy gate
        run: python -m unittest discover -s crates/mail-worker -p 'test_check_observability.py' -v
      - name: Check private staging Identity inbox config
        run: python workers/identity-test-inbox/check_config.py
      - name: Check staging isolation contract
        run: python infra/deploy/check_staging.py

  provider-live:
    name: OpenRouter 256D live contract
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Qwen3 Embedding 8B with synthetic text
        run: python infra/provider/probe_openrouter.py

  deploy-worker:
    name: Deploy mail API
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    needs: [cli, worker, site, dns, provider-live]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: deploy-mail-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: crates/mail-worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      INGRESS_SECRET: ${{ secrets.INGRESS_SECRET }}
    steps:
      - name: Verify deployment secrets before installing tools
        working-directory: .
        shell: bash
        run: |
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN OPENROUTER_API_KEY CF_EMAIL_ROUTING_TOKEN CF_ZONE_ID INGRESS_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing deployment value $key"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Set up Rust Wasm target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deploy tools
        run: |
          cargo install worker-build --version 0.8.3 --locked
          npm install --global wrangler@4.142.0
          python -m pip install -r ../../infra/dns/requirements.txt
      - name: Verify authoritative Email Sending DNS
        working-directory: .
        run: python infra/dns/verify_sending.py
      - name: Disable and verify user-domain Email preview and partial suppression drops
        working-directory: .
        run: python infra/provider/configure_sending_privacy.py --target production
      - name: Verify runtime Email Routing Rules read access
        working-directory: .
        run: python infra/provider/probe_routing.py
      - name: Apply remote D1 migrations
        run: wrangler d1 migrations apply MAIL_DB --remote
      - name: Build Rust Worker bundle
        run: worker-build --release
      - name: Deploy mail Worker with runtime secrets
        shell: bash
        run: |
          umask 077
          mkdir -p ../../.temp
          trap 'rm -f ../../.temp/worker-secrets.json' EXIT
          node -e 'const fs = require("fs"); const keys = ["OPENROUTER_API_KEY", "CF_EMAIL_ROUTING_TOKEN", "INGRESS_SECRET"]; fs.writeFileSync("../../.temp/worker-secrets.json", JSON.stringify(Object.fromEntries(keys.map(key => [key, process.env[key]]))));'
          wrangler deploy --secrets-file ../../.temp/worker-secrets.json
      - name: Verify deployed mail API observability privacy boundary
        run: python check_observability.py --realm production
      - name: Smoke test deployed API
        working-directory: .
        shell: bash
        # 中文：首次自定义域名发布可能短暂遇到 DNS/TLS 传播；仅重试幂等健康 GET。
        # English: First custom-domain publication can briefly race DNS/TLS propagation; retry only an idempotent health GET.
        run: curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --max-time 10 https://mail.moesegfault.dev/health

  deploy-ingress:
    name: Deploy Rust SMTP ingress
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: deploy-ingress-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/mail-ingress
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INGRESS_SECRET: ${{ secrets.INGRESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust Wasm target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust bundler and Wrangler
        run: |
          cargo install worker-build --version 0.8.5 --locked
          npm install --global wrangler@4.142.0
      - name: Build Rust Email ingress
        run: worker-build --release
      - name: Deploy Rust Email-event Worker with shared secret
        shell: bash
        run: |
          test -n "$INGRESS_SECRET"
          umask 077
          mkdir -p ../../.temp
          trap 'rm -f ../../.temp/ingress-secrets.json' EXIT
          node -e 'const fs = require("fs"); fs.writeFileSync("../../.temp/ingress-secrets.json", JSON.stringify({INGRESS_SECRET: process.env.INGRESS_SECRET}));'
          wrangler deploy --secrets-file ../../.temp/ingress-secrets.json

  deploy-events:
    name: Deploy Rust sending lifecycle consumer
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: deploy-events-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/mail-events
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust Wasm target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust bundler and Wrangler
        run: |
          cargo install worker-build --version 0.8.5 --locked
          npm install --global wrangler@4.142.0
      - name: Ensure production lifecycle Queue and DLQ
        working-directory: .
        run: python infra/deploy/ensure_email_events.py --target production --phase queues
      - name: Build Rust lifecycle consumer
        run: worker-build --release
      - name: Deploy production lifecycle consumer
        run: wrangler deploy
      - name: Ensure production Email Sending Event Subscription
        working-directory: .
        run: python infra/deploy/ensure_email_events.py --target production --phase subscription

  release-ready:
    name: Gate public site on published download assets
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Check matching published GitHub Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("site/package.json"))["version"])')
          release=$(gh release view "v$version" --json isDraft,assets 2>/dev/null || true)
          ready=false
          if [ -n "$release" ] && jq -e '.isDraft == false' <<< "$release" > /dev/null; then
            ready=true
            for asset in \
              "amail-v$version-x86_64-unknown-linux-gnu.tar.gz" \
              "amail-v$version-aarch64-unknown-linux-gnu.tar.gz" \
              "amail-v$version-x86_64-pc-windows-msvc.zip" \
              "amail-v$version-aarch64-apple-darwin.tar.gz" \
              "amail-v$version-x86_64-apple-darwin.tar.gz" \
              "amail-agent-skill-v$version.zip" \
              SHA256SUMS; do
              if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' <<< "$release" > /dev/null; then
                ready=false
                break
              fi
            done
          fi
          if [ "$ready" = true ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "Public site deferred: GitHub Release v$version and all expected assets are not published"
          fi

  deploy-site:
    name: Deploy release site
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main' && needs.release-ready.outputs.ready == 'true'
    needs: [deploy-ingress, deploy-events, site, release-ready]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-site-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm build
      - name: Deploy Astro assets to Workers
        run: pnpm run deploy
      - name: Smoke test published pages
        working-directory: .
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 https://amail.moesegfault.dev/ > /dev/null
          curl --fail --silent --show-error https://amail.moesegfault.dev/manual/ > /dev/null
          curl --fail --silent --show-error https://amail.moesegfault.dev/changelog/ > /dev/null
          headers=$(curl --fail --silent --show-error --head https://amail.moesegfault.dev/)
          if grep -iq '^x-robots-tag:.*noindex' <<< "$headers"; then
            echo '::error::Production launch page must be indexable'
            exit 1
          fi

  staging-site:
    name: Deploy isolated staging release site
    if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/amail-v0.1.0') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-site-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify site deploy credentials
        working-directory: .
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build launch site
        run: pnpm build
      - name: Deploy isolated staging Worker
        run: pnpm run deploy:staging
      - name: Smoke test staging launch pages
        working-directory: .
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 https://amail-staging.moesegfault.dev/ > /dev/null
          curl --fail --silent --show-error https://amail-staging.moesegfault.dev/manual/ > /dev/null
          curl --fail --silent --show-error https://amail-staging.moesegfault.dev/changelog/ > /dev/null
          headers=$(curl --fail --silent --show-error --head https://amail-staging.moesegfault.dev/)
          if ! grep -iq '^x-robots-tag:.*noindex' <<< "$headers"; then
            echo '::error::Staging launch page must be noindex'
            exit 1
          fi

  staging-worker:
    name: Deploy isolated staging mail API
    if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/amail-v0.1.0') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    needs: [cli, worker, site, dns, provider-live]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    concurrency:
      group: deploy-mail-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: crates/mail-worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      INGRESS_SECRET: ${{ secrets.INGRESS_SECRET_STAGING }}
      MAIL_SENDING_DOMAIN: mail-staging.moesegfault.dev
    steps:
      - name: Verify staging secrets before installing tools
        working-directory: .
        shell: bash
        run: |
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN OPENROUTER_API_KEY CF_EMAIL_ROUTING_TOKEN INGRESS_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing staging deployment value $key"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Set up Rust Wasm target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify staging resource isolation
        run: python ../../infra/deploy/check_staging.py
      - name: Install deploy tools
        run: |
          cargo install worker-build --version 0.8.3 --locked
          npm install --global wrangler@4.142.0
          python -m pip install -r ../../infra/dns/requirements.txt
      - name: Verify staging authoritative Email Sending DNS
        working-directory: .
        run: python infra/dns/verify_sending.py
      - name: Disable and verify staging user-domain preview and partial suppression drops
        working-directory: .
        run: python infra/provider/configure_sending_privacy.py --target staging
      - name: Verify staging runtime Email Routing Rules read access
        working-directory: .
        run: python infra/provider/probe_routing.py
      - name: Apply staging D1 migrations only
        run: wrangler d1 migrations apply MAIL_DB --remote --env staging
      - name: Build Rust Worker bundle
        run: worker-build --release
      - name: Deploy staging Worker with isolated runtime secrets
        shell: bash
        run: |
          umask 077
          mkdir -p ../../.temp
          trap 'rm -f ../../.temp/worker-staging-secrets.json' EXIT
          node -e 'const fs = require("fs"); const keys = ["OPENROUTER_API_KEY", "CF_EMAIL_ROUTING_TOKEN", "INGRESS_SECRET"]; fs.writeFileSync("../../.temp/worker-staging-secrets.json", JSON.stringify(Object.fromEntries(keys.map(key => [key, process.env[key]]))));'
          wrangler deploy --env staging --secrets-file ../../.temp/worker-staging-secrets.json
      - name: Verify deployed staging mail API observability privacy boundary
        run: python check_observability.py --realm staging
      - name: Smoke test staging API
        working-directory: .
        shell: bash
        # 中文：仅健康 GET 可重试所有网络错误，避免首发 DNS 传播造成误报。
        # English: Retry all network errors only for the health GET, avoiding false first-deploy DNS failures.
        run: curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --max-time 10 https://mail-staging.moesegfault.dev/health

