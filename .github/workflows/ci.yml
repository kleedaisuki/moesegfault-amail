  staging-worker:
    name: Deploy isolated staging mail API
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && github.ref == 'refs/heads/codex/amail-v0.1.0' && inputs.confirm == 'RUN_STAGING_TRACE_SINK_ROLLOUT'
    needs: [cli, worker, site, dns, provider-live, staging-trace-sink]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    concurrency:
      group: deploy-mail-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: crates/mail-worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AMAIL_TRACE_QUEUE_ID: ${{ needs.staging-trace-sink.outputs.queue_id }}
      AMAIL_TRACE_DLQ_ID: ${{ needs.staging-trace-sink.outputs.dlq_id }}
      GH_TOKEN: ${{ github.token }}
      AMAIL_TRACE_CONTAINMENT_RUN: ${{ inputs.trace_containment_run }}
      AMAIL_TRACE_CONTAINMENT_KIND: ${{ inputs.trace_containment_kind }}
      AMAIL_TRACE_CONTAINMENT_VERSION: ${{ inputs.expected_worker_version }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      CF_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      INGRESS_SECRET: ${{ secrets.INGRESS_SECRET_STAGING }}
      MAIL_SENDING_DOMAIN: mail-staging.moesegfault.dev
    steps:
      - name: Verify staging secrets before installing tools
        working-directory: .
        shell: bash
        run: |
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN OPENROUTER_API_KEY CF_EMAIL_ROUTING_TOKEN INGRESS_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing staging deployment value $key"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Set up Rust Wasm target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify staging resource isolation
        run: python ../../infra/deploy/check_staging.py
      - name: Install deploy tools
        run: |
          cargo install worker-build --version 0.8.3 --locked
          npm install --global wrangler@4.142.0
          python -m pip install -r ../../infra/dns/requirements.txt
      - name: Verify staging authoritative Email Sending DNS
        working-directory: .
        run: python infra/dns/verify_sending.py
      - name: Disable and verify staging user-domain preview and partial suppression drops
        working-directory: .
        run: python infra/provider/configure_sending_privacy.py --target staging
      - name: Verify staging runtime Email Routing Rules read access
        working-directory: .
        run: python infra/provider/probe_routing.py
      - name: Require immutable API capture-off containment attestation
        run: python ../../infra/deploy/require_trace_containment.py --run "$AMAIL_TRACE_CONTAINMENT_RUN" --version "$AMAIL_TRACE_CONTAINMENT_VERSION" --kind "$AMAIL_TRACE_CONTAINMENT_KIND"
      - name: Apply staging D1 migrations only
        run: wrangler d1 migrations apply MAIL_DB --remote --env staging
      - name: Build Rust Worker bundle
        run: worker-build --release
      - name: Deploy staging Worker with isolated runtime secrets
        shell: bash
        run: |
          umask 077
          mkdir -p ../../.temp
          trap 'rm -f ../../.temp/worker-staging-secrets.json' EXIT
          node -e 'const fs = require("fs"); const keys = ["OPENROUTER_API_KEY", "CF_EMAIL_ROUTING_TOKEN", "INGRESS_SECRET"]; fs.writeFileSync("../../.temp/worker-staging-secrets.json", JSON.stringify(Object.fromEntries(keys.map(key => [key, process.env[key]]))));'
          wrangler deploy --env staging --secrets-file ../../.temp/worker-staging-secrets.json
      - name: Verify private trace producer and consumer ownership
        working-directory: .
        run: python infra/deploy/ensure_trace_queues.py --target staging --phase readback
      - name: Verify deployed staging mail API observability privacy boundary
        run: python check_observability.py --realm staging
      - name: Smoke test staging API
        working-directory: .
        shell: bash
        # 中文：仅健康 GET 可重试所有网络错误，避免首发 DNS 传播造成误报。
        # English: Retry all network errors only for the health GET, avoiding false first-deploy DNS failures.
        run: curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 5 --max-time 10 https://mail-staging.moesegfault.dev/health

