  deploy-trace-sink:
    name: Deploy private production privacy trace sink
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'production' || inputs.target == 'production-api-only-maintenance') && github.ref == 'refs/heads/main'
    needs: [worker, dns, worker-build]
    outputs:
      queue_id: ${{ steps.upgrade.outputs.queue_id || steps.queues.outputs.queue_id }}
      dlq_id: ${{ steps.upgrade.outputs.dlq_id || steps.queues.outputs.dlq_id }}
      sink_version: ${{ steps.upgrade.outputs.sink_version || steps.sink.outputs.version }}
      policy_fingerprint: ${{ steps.upgrade.outputs.policy_fingerprint }}
      external_fingerprint: ${{ steps.upgrade.outputs.external_fingerprint }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: deploy-trace-sink-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AMAIL_TRACE_QUEUE_ID: ${{ vars.AMAIL_TRACE_QUEUE_ID_PRODUCTION }}
      AMAIL_TRACE_DLQ_ID: ${{ vars.AMAIL_TRACE_DLQ_ID_PRODUCTION }}
      BILLING_SERVICE_KEY: ${{ secrets.BILLING_SERVICE_KEY }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      ROLE_FORWARD_DESTINATION: ${{ secrets.ROLE_FORWARD_DESTINATION }}
      AMAIL_EXPECTED_WORKER_VERSION: ${{ vars.AMAIL_MAIL_VERSION_PRODUCTION }}
      AMAIL_EXPECTED_TRACE_SINK_VERSION: ${{ vars.AMAIL_TRACE_SINK_VERSION_PRODUCTION }}
      AMAIL_PRODUCTION_GRAPH_CONFIRM: ${{ inputs.confirm }}
      AMAIL_PRODUCTION_GRAPH_FREEZE: ${{ inputs.production_graph_freeze }}
      AMAIL_TRACE_TOPOLOGY: api-only
      AMAIL_PRODUCTION_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact tested same-run Worker modules
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.worker-build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Verify source run compiler and every generated byte before provider changes
        working-directory: .
        run: python infra/ci/worker_artifact.py restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit owned active production predecessor without sink or Queue writes
        if: inputs.target == 'production'
        id: upgrade
        run: python infra/deploy/production_v020.py preflight
      - name: Install pinned private sink deployment tools
        if: inputs.target == 'production-api-only-maintenance'
        run: |
          npm install --global wrangler@4.142.0
      - name: Require explicit graph lifecycle before any production mutation
        if: inputs.target == 'production-api-only-maintenance'
        run: python infra/deploy/prepare_production_graph.py --phase "${{ inputs.target == 'production-api-only-maintenance' && 'api-only-maintenance' || 'bootstrap' }}"
      - name: Preserve existing strict graph IDs for maintenance; provision only first bootstrap
        if: inputs.target == 'production-api-only-maintenance'
        id: queues
        shell: bash
        run: |
          if [ "${{ inputs.target == 'production-api-only-maintenance' && 'api-only-maintenance' || 'bootstrap' }}" = api-only-maintenance ]; then
            python infra/deploy/ensure_trace_queues.py --target production --phase readback --topology api-only
            printf 'queue_id=%s\ndlq_id=%s\n' "$AMAIL_TRACE_QUEUE_ID" "$AMAIL_TRACE_DLQ_ID" >> "$GITHUB_OUTPUT"
          else
            python infra/deploy/ensure_trace_queues.py --target production --phase queues --topology api-only
          fi
      - name: Preserve partial provisioning identity without payloads
        if: always() && inputs.target == 'production-api-only-maintenance'
        uses: actions/upload-artifact@v4
        with:
          name: trace-queue-provision-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/trace-queue-provision-production.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Recheck old exact graph immediately before sink replacement
        if: inputs.target == 'production-api-only-maintenance'
        run: python infra/deploy/check_production_role_graph.py --phase api-only
      - name: Deploy Queue-only trace consumer without secrets or HTTP route
        if: inputs.target == 'production-api-only-maintenance'
        id: sink
        working-directory: workers/trace-sink
        run: python ../../infra/deploy/deploy_trace_sink.py --target production
      - name: Verify sink retained telemetry and private trigger boundary
        if: inputs.target == 'production-api-only-maintenance'
        env:
          AMAIL_EXPECTED_TRACE_SINK_VERSION: ${{ steps.sink.outputs.version }}
          AMAIL_TRACE_QUEUE_ID: ${{ steps.queues.outputs.queue_id }}
          AMAIL_TRACE_DLQ_ID: ${{ steps.queues.outputs.dlq_id }}
        run: python crates/mail-worker/check_observability.py --realm production --mode sink

      - name: Verify new sink in unchanged strict API-only graph
        if: inputs.target == 'production-api-only-maintenance'
        env:
          AMAIL_EXPECTED_TRACE_SINK_VERSION: ${{ steps.sink.outputs.version }}
        run: python infra/deploy/check_production_role_graph.py --phase api-only

  staging-trace-sink:
    name: Deploy private staging privacy trace sink
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && github.ref == 'refs/heads/codex/v0.2.0-billing' && inputs.confirm == 'RUN_STAGING_V020'
    needs: [cli, worker, site, dns, provider-live, worker-build]
    outputs:
      queue_id: ${{ steps.predecessor.outputs.reuse_sink == 'true' && steps.predecessor.outputs.queue_id || steps.queues.outputs.queue_id }}
      dlq_id: ${{ steps.predecessor.outputs.reuse_sink == 'true' && steps.predecessor.outputs.dlq_id || steps.queues.outputs.dlq_id }}
      sink_version: ${{ steps.predecessor.outputs.reuse_sink == 'true' && steps.predecessor.outputs.sink_version || steps.sink.outputs.version }}
      rollout: ${{ steps.predecessor.outputs.rollout }}
      reuse_api: ${{ steps.predecessor.outputs.reuse_api }}
      reuse_adapters: ${{ steps.predecessor.outputs.reuse_adapters }}
      ingress_version: ${{ steps.predecessor.outputs.ingress_version }}
      events_version: ${{ steps.predecessor.outputs.events_version }}
      api_version: ${{ steps.predecessor.outputs.api_version }}
      maintenance_version: ${{ steps.predecessor.outputs.maintenance_version }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      AMAIL_TRACE_CONTAINMENT_RUN: ${{ inputs.trace_containment_run }}
      AMAIL_TRACE_CONTAINMENT_KIND: ${{ inputs.trace_containment_kind }}
      AMAIL_TRACE_CONTAINMENT_VERSION: ${{ inputs.expected_worker_version }}
      AMAIL_TRACE_QUEUE_ID: ${{ vars.AMAIL_TRACE_QUEUE_ID_STAGING }}
      AMAIL_TRACE_DLQ_ID: ${{ vars.AMAIL_TRACE_DLQ_ID_STAGING }}
      AMAIL_TRACE_TOPOLOGY: api-scheduled
      AMAIL_STAGING_DEPLOY_CONFIRM: ${{ inputs.confirm }}
      AMAIL_STAGING_RESUME_RUN: ${{ inputs.staging_resume_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact tested same-run Worker modules
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.worker-build.outputs.artifact_id }}
          path: .temp/ci/worker-built
          merge-multiple: true
      - name: Verify source run compiler and every generated byte before provider changes
        working-directory: .
        run: python infra/ci/worker_artifact.py restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit exact isolated staging predecessor before mutation
        id: predecessor
        run: python infra/deploy/staging_rollout.py preflight
      - name: Preserve same-run staging rollout predecessor
        uses: actions/upload-artifact@v4
        with:
          name: staging-rollout-predecessor-${{ github.run_id }}
          path: .temp/staging-rollout-predecessor.json
          if-no-files-found: error
          retention-days: 14
      - name: Install pinned private sink deployment tools
        run: |
          npm install --global wrangler@4.142.0
      - name: Require established staging global hold before Queue or sink changes
        run: python infra/operator/check_send_hold.py --target staging
      - name: Ensure one-day trace Queue and dead-letter Queue
        if: steps.predecessor.outputs.reuse_sink != 'true'
        id: queues
        shell: bash
        run: |
          if [ "${{ steps.predecessor.outputs.rollout }}" = legacy ]; then
            python infra/deploy/ensure_trace_queues.py --target staging --phase queues --topology api-only
          else
            python infra/deploy/ensure_trace_queues.py --target staging --phase readback --topology api-scheduled
            printf 'queue_id=%s\ndlq_id=%s\n' "$AMAIL_TRACE_QUEUE_ID" "$AMAIL_TRACE_DLQ_ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve partial provisioning identity without payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-queue-provision-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/trace-queue-provision-staging.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Deploy Queue-only trace consumer without secrets or HTTP route
        if: steps.predecessor.outputs.reuse_sink != 'true'
        id: sink
        working-directory: workers/trace-sink
        run: python ../../infra/deploy/deploy_trace_sink.py --target staging
      - name: Verify sink retained telemetry and private trigger boundary
        env:
          AMAIL_EXPECTED_TRACE_SINK_VERSION: ${{ steps.predecessor.outputs.reuse_sink == 'true' && steps.predecessor.outputs.sink_version || steps.sink.outputs.version }}
          AMAIL_TRACE_QUEUE_ID: ${{ steps.predecessor.outputs.reuse_sink == 'true' && steps.predecessor.outputs.queue_id || steps.queues.outputs.queue_id }}
          AMAIL_TRACE_DLQ_ID: ${{ steps.predecessor.outputs.reuse_sink == 'true' && steps.predecessor.outputs.dlq_id || steps.queues.outputs.dlq_id }}
          AMAIL_TRACE_TOPOLOGY: ${{ steps.predecessor.outputs.rollout == 'legacy' && 'api-only' || 'api-scheduled' }}
        run: python crates/mail-worker/check_observability.py --realm staging --mode sink
      - name: Verify staging public sending remains held after sink readback
        run: python infra/operator/check_send_hold.py --target staging

  staging-billing-diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging-billing-diagnose' && github.ref == 'refs/heads/codex/v0.2.0-billing' && inputs.confirm == 'DIAGNOSE_STAGING_METERING_37625486364'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BILLING_SERVICE_KEY: ${{ secrets.BILLING_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Project only fixed synthetic outbox and safe retained spans
        run: python infra/tests/staging_billing_diagnose.py

  staging-maintenance-repair:
