      - name: Install Rust bundler and Wrangler
        run: |
          cargo install worker-build --version 0.8.5 --locked
          npm install --global wrangler@4.142.0
      - name: Build Rust Email ingress
        run: worker-build --release
      - name: Deploy staging Rust Email-event Worker
        shell: bash
        run: |
          test -n "$INGRESS_SECRET"
          umask 077
          mkdir -p ../../.temp
          trap 'rm -f ../../.temp/ingress-staging-secrets.json' EXIT
          node -e 'const fs = require("fs"); fs.writeFileSync("../../.temp/ingress-staging-secrets.json", JSON.stringify({INGRESS_SECRET: process.env.INGRESS_SECRET}));'
          wrangler deploy --env staging --secrets-file ../../.temp/ingress-staging-secrets.json

  staging-events:
    name: Deploy isolated Rust staging lifecycle consumer
    if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/amail-v0.1.0') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    needs: staging-worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    concurrency:
      group: deploy-events-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/mail-events
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust Wasm target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust bundler and Wrangler
        run: |
          cargo install worker-build --version 0.8.5 --locked
          npm install --global wrangler@4.142.0
      - name: Ensure staging lifecycle Queue and DLQ
        working-directory: .
        run: python infra/deploy/ensure_email_events.py --target staging --phase queues
      - name: Build Rust lifecycle consumer
        run: worker-build --release
      - name: Deploy staging lifecycle consumer
        run: wrangler deploy --env staging
      - name: Ensure staging Email Sending Event Subscription
        working-directory: .
        run: python infra/deploy/ensure_email_events.py --target staging --phase subscription

  staging-identity-test-inbox:
    name: Deploy private staging Identity verification inbox
    if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/amail-v0.1.0') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    needs: [worker, dns]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    concurrency:
      group: deploy-identity-test-inbox-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
      CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Verify deploy credentials
        shell: bash
        run: |
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CF_EMAIL_ROUTING_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing $key"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Set up Rust Wasm target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust bundler and Wrangler
        run: |
          cargo install worker-build --version 0.8.5 --locked
          npm install --global wrangler@4.142.0
      - name: Refuse deployment while any public test alias is routed
        shell: bash
        run: |
          state=$(python workers/identity-test-inbox/ensure_route.py --all-absent)
          if [ "$state" != absent ]; then
            echo '::error::Close every exact test route before replacing the inbox Worker'
            exit 1
          fi
      - name: Check private staging binding and no HTTP surface
        run: python workers/identity-test-inbox/check_config.py --live
      - name: Build private Rust Email Worker
        working-directory: workers/identity-test-inbox
        run: worker-build --release
      - name: Deploy staging Identity test inbox without routing rule
        working-directory: workers/identity-test-inbox
        run: wrangler deploy
      - name: Verify deployment did not open any test alias
        shell: bash
        run: |
          state=$(python workers/identity-test-inbox/ensure_route.py --all-absent)
          if [ "$state" != absent ]; then
            echo '::error::Inbox deployment unexpectedly changed Email Routing'
            exit 1
          fi
      - name: Read back deployed recipient allowlist and private bucket
        run: python workers/identity-test-inbox/check_config.py --live --deployed

  staging-role-monitor:
    name: Deploy isolated staging role monitor
    if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/amail-v0.1.0') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    needs: [worker, dns]
