# 中文：在 GitHub 托管的运行器上验证全部平台；本地开发机不执行重型构建。
# English: Validate supported platforms on GitHub-hosted runners, not the developer workstation.
name: CI and deploy

on:
  pull_request:
  push:
    branches: [main, codex/amail-v0.1.0]
  workflow_dispatch:
    inputs:
      target:
        description: Run non-deploying checks, deploy staging, or promote production after review
        required: true
        type: choice
        options: [checks, staging, staging-containment-settings, staging-containment-readback, staging-worker-resource-readback, staging-role-queue-rollout, staging-e2e, staging-r2-object-capability, staging-r2-object-recover, staging-second-principal-preflight, staging-second-principal, staging-second-principal-recover, staging-semantic-query-only, staging-prior-alias-reconcile, staging-hosted-alias-reconcile, staging-fifth-mail-audit, staging-fifth-mail-cleanup, staging-serving-pin, staging-routing-policy, staging-routing-write-probe, staging-routing-write-recover, staging-routing-write-audit, staging-routing-diagnostic, staging-current-address-diagnostic, staging-fourth-invocation-metrics, staging-role-smtp, staging-role-timeout-audit, staging-role-token-phase-probe, staging-role-phase-logs, staging-trace-canary, staging-trace-sink-canary, staging-trace-marker-location, staging-trace-marker-discriminator, staging-trace-http-compare, staging-trace-security-events, production]
      confirm:
        description: Staging E2E, semantic query, role SMTP, or trace canary requires its documented RUN_* confirmation
        required: false
        type: string
      r2_prior_run_id:
        description: Original numeric R2 capability probe run ID; recovery only
        required: false
        type: string
      r2_prior_run_attempt:
        description: Original numeric R2 capability probe attempt; recovery only
        required: false
        type: string
      role_deploy_run:
        description: Role SMTP deployed-role run; role Queue rollout exact-revision phase1 API/sink deploy run
        required: false
        type: string
      role_probe_run_id:
        description: Historical failed role SMTP run ID; role timeout read-only audit only
        required: false
        type: string
      role_version:
        description: Current 100%-serving role Worker UUID; SMTP or pre-rollout replacement pin
        required: false
        type: string
      role_freeze:
        description: For role SMTP enter FREEZE_STAGING_ROLE_DEPLOYS after enforcing external deploy freeze
        required: false
        type: string
      trace_containment_run:
        description: Successful immutable staging containment deployment or settings-only attestation run
        required: false
        type: string
      trace_containment_kind:
        description: Immutable containment evidence type; settings-only correction does not redeploy API code
        required: false
        default: deploy-v1
        type: choice
        options: [deploy-v1, settings-v1]
      trace_sink_version:
        description: Reviewed 100-percent serving Queue trace sink version UUID
        required: false
        type: string
      trace_sink_canary_run:
        description: Prior successful bounded retained-record API/sink privacy canary; role Queue rollout only
        required: false
        type: string
      trace_mode:
        description: For staging-trace-canary only; preflight does not log in
        required: false
        default: preflight
        type: choice
        options: [preflight, canary]
      semantic:
        description: Also check semantic search on the same two staging-e2e messages
        required: false
        default: false
        type: boolean
      exact_cosine:
        description: Private staging D1 and OpenRouter two-page oracle on the same two messages; requires semantic
        required: false
        default: false
        type: boolean
      exact_cosine_confirm:
        description: Enter RUN_STAGING_EXACT_COSINE only for the private exact-cosine oracle
        required: false
        type: string
      isolation:
        description: Add B denial checks to the same two staging-e2e SMTP fixtures
        required: false
        default: false
        type: boolean
      isolation_confirm:
        description: Distinct RUN_STAGING_TWO_PRINCIPAL_ISOLATION confirmation
        required: false
        type: string
      expected_worker_version:
        description: Expected 100%-serving staging Mail Worker Version ID; serving pin or containment readback
        required: false
        type: string
      alias_run_id:
        description: Completed hosted staging-e2e GitHub run ID to reconcile; no address is accepted
        required: false
        type: string
      alias_attempt:
        description: GitHub run attempt for that exact staging-e2e run
        required: false
        type: string
      routing_probe_run_id:
        description: Original one-use routing Write probe run ID for recovery or delayed audit
        required: false
        type: string
      routing_probe_attempt:
        description: Original one-use routing Write probe attempt for recovery or delayed audit
        required: false
        type: string

permissions:
  contents: read

# Checks can supersede obsolete checks; shared-state manual operations never cancel each other.
# Keep the existing manual group so in-flight acceptance remains mutually exclusive.
concurrency:
  group: ci-${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'checks') && 'checks-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'checks' }}

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    # Manual diagnostic jobs run independently; do not duplicate the full test matrix.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.head_ref != 'codex/amail-v0.1.0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'checks' || inputs.target == 'staging' || inputs.target == 'production'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Update stable Rust toolchain
        run: rustup update stable
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Test CLI
        run: cargo test -p amail --locked --all-targets
      - name: Check CLI help
        run: cargo run -p amail --locked -- --help
      - name: Upload tested Windows binary for staging live smoke
        if: matrix.os == 'windows-latest' && github.event_name == 'push' && github.ref == 'refs/heads/codex/amail-v0.1.0'
        uses: actions/upload-artifact@v4
        with:
          name: amail-windows-smoke-${{ github.sha }}
          path: target/debug/amail.exe
          if-no-files-found: error
          retention-days: 3

  staging-e2e:
    name: Hosted Windows native PKCE and SMTP to ZIP/search
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-e2e' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: windows-latest
    environment: staging
    timeout-minutes: 40
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit staging probe confirmation
        env:
          AMAIL_STAGING_E2E_CONFIRM: ${{ inputs.confirm }}
        run: |
          if ($env:AMAIL_STAGING_E2E_CONFIRM -ne 'RUN_STAGING_E2E') {
            throw 'Explicit staging E2E confirmation required'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install browser and DPAPI adapters
        run: python -m pip install pywin32==312 websocket-client==1.9.2
      - name: Build tested amail binary on hosted Windows
        run: |
          rustup update stable
          cargo test -p amail --locked --all-targets
          cargo build -p amail --locked
      - name: Execute staging native and inbound-mail acceptance
        env:
          AMAIL_STAGING_E2E_CONFIRM: ${{ inputs.confirm }}
          AMAIL_STAGING_SEMANTIC_E2E: ${{ inputs.semantic && '1' || '0' }}
          AMAIL_STAGING_EXACT_COSINE_E2E: ${{ inputs.exact_cosine && '1' || '0' }}
          AMAIL_STAGING_EXACT_COSINE_CONFIRM: ${{ inputs.exact_cosine_confirm }}
          AMAIL_STAGING_ISOLATION_E2E: ${{ inputs.isolation && '1' || '0' }}
          AMAIL_STAGING_ISOLATION_CONFIRM: ${{ inputs.isolation_confirm }}
          STAGING_E2E_USERNAME: ${{ secrets.STAGING_E2E_USERNAME }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          STAGING_E2E_B_USERNAME: ${{ inputs.isolation && secrets.STAGING_E2E_B_USERNAME || '' }}
          STAGING_E2E_B_PASSWORD: ${{ inputs.isolation && secrets.STAGING_E2E_B_PASSWORD || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AMAIL_TEST_SMTP_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_hosted_e2e.py

  staging-r2-object-capability:
    name: One-shot private staging R2 object capability or exact-key recovery
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'staging-r2-object-capability' || inputs.target == 'staging-r2-object-recover') &&
      github.ref == 'refs/heads/codex/amail-v0.1.0'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 8
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit probe or recovery confirmation
        env:
          R2_CONFIRM: ${{ inputs.confirm }}
        shell: pwsh
        run: |
          $expected = if ('${{ inputs.target }}' -eq 'staging-r2-object-capability') {
            'RUN_STAGING_R2_OBJECT_CAPABILITY'
          } else {
            'RECOVER_STAGING_R2_OBJECT_CAPABILITY'
          }
          if ($env:R2_CONFIRM -ne $expected) {
            throw 'Explicit staging R2 capability confirmation required'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Probe one private sentinel and reconcile exact-key cleanup
        env:
          AMAIL_R2_CAPABILITY_CONFIRM: ${{ inputs.confirm }}
          AMAIL_R2_CAPABILITY_MODE: ${{ inputs.target == 'staging-r2-object-recover' && 'recover' || 'probe' }}
          AMAIL_R2_PRIOR_RUN_ID: ${{ inputs.r2_prior_run_id }}
          AMAIL_R2_PRIOR_RUN_ATTEMPT: ${{ inputs.r2_prior_run_attempt }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_r2_object_capability.py

  staging-second-principal-preflight:
    name: Read-only second-principal Identity, routing and private-R2 preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-second-principal-preflight' &&
      github.ref == 'refs/heads/codex/amail-v0.1.0'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 8
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Require exact read-only preflight confirmation
        env:
          SECOND_PREFLIGHT_CONFIRM: ${{ inputs.confirm }}
        shell: pwsh
        run: |
          if ($env:SECOND_PREFLIGHT_CONFIRM -ne 'READ_STAGING_SECOND_PRINCIPAL_PREFLIGHT') {
            throw 'Explicit second-principal read-only preflight confirmation required'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install import-only CDP dependency
        run: python -m pip install websocket-client==1.9.2
      - name: Read exact staging inbox, routes, Identity and R2 state
        env:
          AMAIL_SECOND_PRINCIPAL_CONFIRM: ${{ inputs.confirm }}
          AMAIL_SECOND_PRINCIPAL_MODE: preflight
          STAGING_E2E_B_USERNAME: ${{ secrets.STAGING_E2E_B_USERNAME }}
          STAGING_E2E_B_PASSWORD: ${{ secrets.STAGING_E2E_B_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_second_principal.py

  staging-second-principal:
    name: One-shot normal registration and native PKCE for principal B
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'staging-second-principal' || inputs.target == 'staging-second-principal-recover') &&
      github.ref == 'refs/heads/codex/amail-v0.1.0'
    runs-on: windows-latest
    environment: staging
    timeout-minutes: 20
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Require one-shot staging registration confirmation
        env:
          SECOND_CONFIRM: ${{ inputs.confirm }}
        run: |
          $expected = if ('${{ inputs.target }}' -eq 'staging-second-principal') {
            'RUN_STAGING_SECOND_PRINCIPAL_PROVISION'
          } else {
            'RUN_STAGING_SECOND_PRINCIPAL_RECOVER'
          }
          if ($env:SECOND_CONFIRM -ne $expected) {
            throw 'Explicit second-principal registration confirmation required'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install private native browser adapters
        run: python -m pip install pywin32==312 websocket-client==1.9.2
      - name: Build tested CLI on hosted Windows
        run: |
          rustup update stable
          cargo test -p amail --locked --all-targets
          cargo build -p amail --locked
      - name: Register, verify and attest second principal
        env:
          AMAIL_SECOND_PRINCIPAL_CONFIRM: ${{ inputs.confirm }}
          AMAIL_SECOND_PRINCIPAL_MODE: ${{ inputs.target == 'staging-second-principal-recover' && 'recover' || 'provision' }}
          STAGING_E2E_B_USERNAME: ${{ secrets.STAGING_E2E_B_USERNAME }}
          STAGING_E2E_B_PASSWORD: ${{ secrets.STAGING_E2E_B_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_ZONE_ID: 6edff81c6ed02f412e70868076411a5e
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_second_principal.py

  staging-semantic-query-only:
    name: Hosted native PKCE empty-mail semantic query without SMTP
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-semantic-query-only' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: windows-latest
    environment: staging
    timeout-minutes: 30
    concurrency:
      group: staging-native-mail-acceptance
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Require one-shot semantic-query confirmation
        env:
          AMAIL_SEMANTIC_QUERY_CONFIRM: ${{ inputs.confirm }}
        run: |
          if ($env:AMAIL_SEMANTIC_QUERY_CONFIRM -ne 'RUN_STAGING_SEMANTIC_QUERY_ONLY') {
            throw 'Explicit staging semantic-query confirmation required'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install native browser and DPAPI adapters
        run: python -m pip install pywin32==312 websocket-client==1.9.2
      - name: Build tested native CLI on hosted Windows
        run: |
          rustup update stable
          cargo test -p amail --locked --all-targets
          cargo build -p amail --locked
      - name: Probe only empty owner inventory and semantic query
        env:
          AMAIL_SEMANTIC_QUERY_CONFIRM: ${{ inputs.confirm }}
          STAGING_E2E_USERNAME: ${{ secrets.STAGING_E2E_USERNAME }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_semantic_query_only.py

  staging-prior-alias-reconcile:
    name: Read-only reconciliation of two prior staging aliases
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-prior-alias-reconcile' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    concurrency:
      group: staging-prior-alias-reconcile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Require explicit read-only reconciliation confirmation
        env:
          RECONCILE_CONFIRM: ${{ inputs.confirm }}
        shell: pwsh
        run: |
          if ($env:RECONCILE_CONFIRM -ne 'READ_PRIOR_STAGING_ALIASES') {
            throw 'Explicit prior-alias reconciliation confirmation required'
          }
      - name: Check exact prior aliases without mutation
        env:
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_prior_alias_reconcile.py READ_PRIOR_STAGING_ALIASES

  staging-containment-settings:
    name: Apply isolated staging API capture-off settings
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-containment-settings' &&
      github.ref == 'refs/heads/codex/amail-v0.1.0'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    concurrency:
      group: deploy-mail-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require one-shot staging settings confirmation before credentials
        env:
          SETTINGS_CONFIRM: ${{ inputs.confirm }}
          EXPECTED_VERSION: ${{ inputs.expected_worker_version }}
        shell: bash
        run: |
          if [ "$SETTINGS_CONFIRM" != 'APPLY_STAGING_API_CAPTURE_OFF_SETTINGS' ] ||
             [ "$EXPECTED_VERSION" != 'c3f6401a-1e84-4f51-91df-ae77d90683e9' ] ||
             [ "$GITHUB_RUN_ATTEMPT" != '1' ]; then
            echo '::error::Exact first-attempt staging capture-settings confirmation required'
            exit 1
          fi
      - name: Test synthetic settings correction before credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s infra/tests -p 'test_staging_capture_off.py' -v
          python -m unittest discover -s crates/mail-worker -p 'test_check_observability.py' -v
      - name: Correct only non-versioned capture settings and attest unchanged serving API
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AMAIL_EXPECTED_WORKER_VERSION: ${{ inputs.expected_worker_version }}
          AMAIL_CONTAINMENT_CONFIRM: ${{ inputs.confirm }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/deploy/apply_staging_capture_off.py

  staging-containment-readback:
    name: Read-only staging containment settings discriminator
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-containment-readback' &&
      github.ref == 'refs/heads/codex/amail-v0.1.0'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require read-only confirmation and expected version
        shell: pwsh
        env:
          READ_CONFIRM: ${{ inputs.confirm }}
          EXPECTED_VERSION: ${{ inputs.expected_worker_version }}
        run: |
          if ($env:READ_CONFIRM -cne 'READ_STAGING_CONTAINMENT_SETTINGS' -or
              $env:EXPECTED_VERSION -cnotmatch '^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$') {
            throw 'Exact read-only confirmation and expected staging version required'
          }
      - name: Test synthetic containment readback contracts before credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s infra/tests -p 'test_staging_containment_readback.py' -v
      - name: Read control-plane categorical settings with deployment brackets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AMAIL_EXPECTED_WORKER_VERSION: ${{ inputs.expected_worker_version }}
          AMAIL_CONTAINMENT_CONFIRM: ${{ inputs.confirm }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_containment_readback.py

  staging-worker-resource-readback:
    name: Read-only staging Worker resource observability discriminator
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-worker-resource-readback' &&
      github.ref == 'refs/heads/codex/amail-v0.1.0'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require distinct read-only confirmation and expected version
        shell: pwsh
        env:
          READ_CONFIRM: ${{ inputs.confirm }}
          EXPECTED_VERSION: ${{ inputs.expected_worker_version }}
        run: |
          if ($env:READ_CONFIRM -cne 'READ_STAGING_WORKER_RESOURCE_OBSERVABILITY' -or
              $env:EXPECTED_VERSION -cnotmatch '^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$') {
            throw 'Exact Worker resource confirmation and expected staging version required'
          }
      - name: Test synthetic Worker resource contracts before credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s infra/tests -p 'test_staging_worker_resource_readback.py' -v
      - name: Read categorical representations with five-GET deployment bracket
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AMAIL_EXPECTED_WORKER_VERSION: ${{ inputs.expected_worker_version }}
          AMAIL_WORKER_RESOURCE_CONFIRM: ${{ inputs.confirm }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python infra/tests/staging_worker_resource_readback.py

  staging-serving-pin:
    name: Read-only pin of 100%-serving staging Mail Worker
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging-serving-pin' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/amail-v0.1.0')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    concurrency:
      group: staging-serving-pin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read serving deployment, settings and bindings without mutation
        env:
